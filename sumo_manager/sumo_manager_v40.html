<meta name="theme-color" content="#1d1a16">
<title>Sumo Manager v40</title>
<style>
:root{
 --washi:#f3ede0;--washi2:#ebe3d1;--paper:#fbf8f1;--sumi:#1d1a16;--sumi2:#4a443b;--mute:#7d7365;
 --shu:#b5361f;--shu2:#d9573e;--kin:#a8823c;--ai:#2c3e5c;--ai2:#47618c;--midori:#3f6b4a;--line:#c9bda4;
 --kaku:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
 --min:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","BIZ UDPMincho",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--washi);color:var(--sumi);font-family:var(--min);font-size:16px;line-height:1.6;
 background-image:radial-gradient(rgba(120,100,70,.06) 1px,transparent 1px),radial-gradient(rgba(120,100,70,.04) 1px,transparent 1px);
 background-size:7px 7px,13px 13px;background-position:0 0,3px 5px;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
#app{max-width:1180px;margin:0 auto;padding:0 14px 40px}
/* header */
#hdr{position:sticky;top:0;z-index:20;background:linear-gradient(#1d1a16,#2a251f);color:#f3ede0;margin:0 -14px;padding:10px 18px calc(8px) ;padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 2px 8px rgba(0,0,0,.25)}
#hdr .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#hdr .title{font-size:22px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
#hdr .title small{font-size:13px;color:#d8c9a6;letter-spacing:.05em;margin-left:8px;font-weight:400}
#hdr .stat{display:flex;gap:16px;margin-left:auto;font-family:var(--kaku);font-size:14px;flex-wrap:wrap}
#hdr .stat b{color:#f1d38e;font-weight:600;font-size:16px;margin-left:4px}
#hdr .cal{background:var(--shu);color:#fff;padding:2px 12px;border-radius:2px;font-size:15px;letter-spacing:.08em;white-space:nowrap}
#nav{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:12px 0}
#nav button{background:linear-gradient(#efe6d3,#e0d4ba);border:1px solid #b9a988;border-bottom-width:3px;border-radius:4px;padding:10px 4px;font-size:16px;color:var(--sumi);letter-spacing:.1em;min-height:48px}
#nav button.on{background:linear-gradient(#2c3e5c,#1f2d45);color:#fff;border-color:#1a2539}
#nav button .bd{display:inline-block;background:var(--shu);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:4px;font-family:var(--kaku);letter-spacing:0;vertical-align:2px}
/* panels */
.pn{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 4px rgba(60,40,10,.06)}
.pn h2{margin:0 0 10px;font-size:19px;letter-spacing:.14em;border-left:5px solid var(--shu);padding-left:10px;display:flex;align-items:center;gap:8px}
.pn h2 .sub{font-size:13px;color:var(--mute);letter-spacing:.04em;font-family:var(--kaku);font-weight:400;margin-left:auto}
.pn h3{margin:12px 0 6px;font-size:16px;letter-spacing:.1em;color:var(--ai)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2>*,.grid3>*{min-width:0}.tb td.num{white-space:nowrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-family:var(--kaku);font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.mute{color:var(--mute)}.kaku{font-family:var(--kaku)}
.shu{color:var(--shu)}.ai{color:var(--ai)}.kin{color:var(--kin)}.mid{color:var(--midori)}
.btn{background:linear-gradient(#f6efe0,#e3d6bb);border:1px solid #a99572;border-bottom-width:3px;border-radius:4px;padding:8px 16px;font-size:16px;min-height:44px;color:var(--sumi);letter-spacing:.06em}
.btn:active{transform:translateY(1px);border-bottom-width:2px}
.btn.main{background:linear-gradient(#c8432a,#9e2d18);border-color:#7b2010;color:#fff;font-size:18px;padding:10px 26px;letter-spacing:.14em}
.btn.ai{background:linear-gradient(#3b5378,#26385a);border-color:#1a2539;color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font-family:var(--kaku);font-size:15px;padding:6px 6px;border:1px solid #b9a988;border-radius:3px;background:#fffdf7;min-height:38px}
input[type=text]{font-family:var(--min);font-size:17px;padding:8px;border:1px solid #b9a988;border-radius:3px;background:#fffdf7;width:100%}
/* tables */
table{border-collapse:collapse;width:100%}
.tb{font-family:var(--kaku);font-size:14px}
.tb th{background:#e8dec8;color:var(--sumi2);font-weight:600;padding:6px 6px;border-bottom:2px solid var(--line);text-align:left;white-space:nowrap}
.tb td{padding:6px 6px;border-bottom:1px solid #e3d9c4;vertical-align:middle}
.tb tr.me td{background:#fbe9e2}
.tb tr.clk{cursor:pointer}
.tb tr.clk:hover td{background:#f4ecda}
.nm{font-family:var(--min);font-size:16px;font-weight:700;letter-spacing:.06em}
.hy{font-size:12px;color:var(--mute);margin-left:4px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.res{display:inline-grid;grid-template-columns:repeat(15,1.15em);gap:1px;font-size:14px;font-family:var(--kaku)}
.res span{text-align:center}
.wl{font-family:var(--kaku);font-weight:600;white-space:nowrap}
/* banzuke */
.bzw{overflow-x:auto}
.bz{font-family:var(--kaku);font-size:14px;min-width:640px}
.bz td{padding:5px 6px;border-bottom:1px solid #e3d9c4}
.bz td.rk{text-align:center;background:#efe5cf;color:var(--sumi2);font-family:var(--min);font-weight:700;white-space:nowrap;width:110px;letter-spacing:.08em}
.bz td.e{text-align:right}
.bz .me{background:#fbe0d6;border-radius:2px;padding:1px 4px}
.divbtn{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.divbtn button{background:#efe6d3;border:1px solid #b9a988;border-radius:3px;padding:6px 14px;font-size:15px;min-height:40px}
.divbtn button.on{background:var(--sumi);color:#fff;border-color:var(--sumi)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;display:flex;gap:12px;padding:12px;cursor:pointer;box-shadow:0 2px 4px rgba(60,40,10,.06)}
.card:hover{border-color:var(--kin)}
.fuda{writing-mode:vertical-rl;background:linear-gradient(90deg,#d9c39a,#e9d8b4 40%,#d4bd92);border:1px solid #8e7347;color:#1d1a16;font-weight:800;font-size:24px;letter-spacing:.12em;padding:10px 6px;border-radius:2px;min-height:130px;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.fuda.sk{background:linear-gradient(90deg,#2a2520,#3b342c 40%,#2a2520);color:#f1d38e;border-color:#000}
.card .info{flex:1;font-family:var(--kaku);font-size:14px;min-width:0}
.card .rk{font-family:var(--min);font-weight:700;font-size:16px;color:var(--ai);letter-spacing:.08em}
.bar{height:8px;background:#e6dcc6;border-radius:4px;overflow:hidden;margin:2px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ai2),var(--ai))}
.bar.p i{background:linear-gradient(90deg,#d6a14d,var(--kin))}
.sts{display:grid;grid-template-columns:3em 1fr 2.4em;align-items:center;gap:0 6px;font-size:13px}
.tag{display:inline-block;font-size:12px;border:1px solid currentColor;border-radius:2px;padding:0 5px;margin-left:4px;font-family:var(--kaku);vertical-align:1px}
.inj{color:#fff;background:var(--shu);border-color:var(--shu)}
/* bouts */
.rgrid{display:block}@media(min-width:760px){.rgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}}@media(min-width:1100px){.rgrid{grid-template-columns:1fr 1fr 1fr}}.wlb{display:inline-block;min-width:3.2em;text-align:center;border-radius:4px;padding:1px 4px;font-size:13px;font-weight:bold;color:#fff}.wlb.wn{background:#b8322a}.wlb.ls{background:#5d6b7a}.rtag{display:inline-block;font-size:12px;border:1px solid #b8322a;color:#b8322a;border-radius:10px;padding:0 6px;margin-left:4px}.rtag.g{border-color:#7a6a55;color:#7a6a55}.r1{padding:8px 0;border-bottom:1px dashed #d8cdb4;font-size:15px}.r1 .sm{font-size:12px;color:#7a6a55}.r1 details summary{cursor:pointer;color:#7a6a55;font-size:13px;margin-top:2px}.r1 .nar{font-size:13px;margin-top:4px}
.bout{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px dashed #d8cdb4;font-family:var(--kaku);font-size:14px}
.bout .l{text-align:right}.bout .k{text-align:center;color:var(--shu);font-family:var(--min);font-weight:700;min-width:7em}
.bout .w{font-weight:700}
.bout .nar{grid-column:1/4;font-size:13px;color:var(--sumi2);font-family:var(--min);padding-left:4px}
.daybar{display:flex;gap:3px;margin:8px 0}
.daybar i{flex:1;height:10px;background:#e3d8c0;border-radius:2px}
.daybar i.d{background:var(--shu)}
.big{font-size:28px;font-weight:800;letter-spacing:.14em}
.hl{background:#fbf2df;border:1px solid #e3cf9e;border-radius:4px;padding:10px 12px;margin:8px 0;font-family:var(--kaku);font-size:15px}
.sdh{font-size:13px;color:#7a6a55;margin-bottom:4px}.sdq{position:relative;background:var(--paper);color:var(--sumi);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:2px 0 8px 14px}.sdq:before{content:'';position:absolute;left:-8px;top:12px;border:8px solid transparent;border-right-color:var(--line);border-left:0}.kp{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.kp button{border:1px solid var(--line);background:var(--washi2);color:var(--sumi);border-radius:18px;padding:6px 12px;font-size:14px;cursor:pointer}.kp small{color:var(--mute)}
.ev{border:1px solid var(--line);border-left:5px solid var(--kin);background:#fffaf0;border-radius:4px;padding:10px 12px;margin:8px 0}
.ev b{font-family:var(--min);font-size:17px;letter-spacing:.06em}
.ev p{margin:4px 0 8px;font-family:var(--kaku);font-size:15px}
.log{font-family:var(--kaku);font-size:14px;max-height:280px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px dotted #d8cdb4}
/* modal */
#mdl{position:fixed;inset:0;background:rgba(20,15,10,.55);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 12px 20px;overflow:auto}
#mdl.on{display:flex}
#mdl .box{background:var(--paper);border-radius:6px;max-width:760px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.4);border-top:6px solid var(--shu)}
#mdl .x{float:right}
/* start */
.start{max-width:640px;margin:40px auto;text-align:center}
.start h1{font-size:44px;letter-spacing:.3em;margin:10px 0;writing-mode:horizontal-tb}
.start .lead{font-family:var(--kaku);color:var(--sumi2)}
.start label{display:block;text-align:left;margin:12px 0 4px;font-family:var(--kaku);font-size:14px;color:var(--sumi2)}
.dohyo{width:120px;height:120px;border-radius:50%;margin:10px auto;background:radial-gradient(circle,#d8c08c 0 52%,#efe6d3 53% 56%,#c6ab72 57% 70%,#8b6f3e 71% 100%);box-shadow:0 4px 12px rgba(0,0,0,.25)}
@media (max-width:900px){#nav{grid-template-columns:repeat(5,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}#hdr .title{font-size:18px}#hdr .stat{margin-left:0;gap:10px;font-size:13px}#nav button{font-size:14px;letter-spacing:.02em;padding:8px 2px}.res{font-size:12px}.hide-s{display:none}}
/* v2 */
.gg{display:inline-block;width:72px;height:9px;background:#e6dcc6;border-radius:5px;overflow:hidden;vertical-align:middle}
.gg i{display:block;height:100%;background:var(--ai2)}
.gg.g i{background:#4f8a5b}.gg.g2 i{background:#8fb48f}.gg.y i{background:#d6a14d}.gg.r i{background:var(--shu2)}
.sts .gg{width:100%}
.atw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.atc{background:#fffdf7;border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.atg{font-weight:700;letter-spacing:.2em;color:var(--ai);border-bottom:1px solid var(--line);margin-bottom:4px}
.atr{display:grid;grid-template-columns:1fr 2em 2em;align-items:center;font-family:var(--kaku);font-size:14px;padding:2px 0}
.atr b{text-align:right;font-size:16px;font-variant-numeric:tabular-nums}.atr i{font-style:normal;font-size:12px;text-align:right}
.a1{color:#9a917f}.a2{color:var(--sumi)}.a3{color:#2f7a3e}.a4{color:var(--shu);font-weight:800}
.nx{border:1px solid var(--line);border-left:5px solid var(--ai);background:#fffdf7;border-radius:4px;padding:8px 10px;margin:8px 0}
.nxm{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:4px}
.nxm>div:last-child{text-align:right}.vs{font-weight:700;color:var(--shu)}
.clk2{cursor:pointer;text-decoration:underline dotted var(--line)}
.sks{display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0;font-family:var(--kaku);font-size:14px}
.sk b{font-size:16px}
.stf{border-bottom:1px dashed #d8cdb4;padding:8px 0}
.cards.sc{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.spk{display:block;background:#fffdf7;border:1px solid #e3d9c4;border-radius:3px}
.tb select{min-height:36px;font-size:14px}
.tb td:first-child{white-space:nowrap}
.nar-only{display:none}.kr{border-bottom:1px dashed #d8cdb4;padding:8px 0}.krh{margin-bottom:4px}
@media (max-width:640px){.nar-only{display:block}.wide-only{display:none}}
@media (max-width:640px){.atw{gap:4px}.atc{padding:4px 5px}.atr{grid-template-columns:1fr 1.5em .1em;font-size:11.5px;letter-spacing:-.03em}.atr b{font-size:14px}.atr i{display:none}#nav button{font-size:13px}.gg{width:54px}.cards.sc{grid-template-columns:1fr}}

.st-bg1:after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.75) 100%)}
.st-title{position:fixed;top:6%;left:50%;transform:translateX(-50%);text-align:center;z-index:2;width:92vw;color:#fff}
.st-title h1{display:inline-block;background:#b3261e;border:3px solid #f3e3c3;padding:10px 22px;font-size:clamp(28px,5.5vw,58px);letter-spacing:.06em;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.5);margin:0}
.st-title p{display:inline-block;margin-top:10px;font-size:clamp(15px,2.2vw,22px);letter-spacing:.4em;padding:4px 10px 4px 16px;background:rgba(0,0,0,.6);border-radius:3px}
.st-go{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);display:flex;gap:18px;width:min(900px,92vw);z-index:2}
.st-go button{flex:1;padding:18px 16px;border:2px solid #f3e3c3;color:#fff;text-align:left;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.5);font-family:var(--min);cursor:pointer;-webkit-tap-highlight-color:transparent}
.st-go{flex-wrap:wrap}.st-go .st-cont{flex:1 1 100%;background:rgba(20,16,10,.88);border-color:#e9c46a;text-align:center;padding:12px 16px}.st-go .st-cont b{color:#e9c46a;margin-bottom:2px}
.st-warn{margin:10px auto 0;max-width:600px;background:rgba(179,38,30,.92);color:#fff;border:1px solid #f3e3c3;border-radius:4px;padding:6px 10px;font:14px/1.5 var(--kaku);text-align:center}
.st-upd{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:4;background:rgba(10,8,6,.6);border:1.5px solid #e9c46a;color:#f2e8d0;border-radius:999px;padding:5px 14px;font:13px/1.4 var(--kaku);cursor:pointer}
.st-upd.new{background:#c9a24a;color:#1d1a16;font-weight:bold;animation:stpulse 1.6s ease-in-out infinite}@keyframes stpulse{50%{box-shadow:0 0 0 6px rgba(233,196,106,.35)}}
.updbar{display:block;width:100%;margin:8px 0 0;background:#c9a24a;color:#1d1a16;border:0;border-radius:4px;padding:8px 12px;font:bold 14px/1.4 var(--kaku);text-align:center;cursor:pointer}
.st-go .st-real{background:rgba(179,38,30,.92)} .st-go .st-new{background:rgba(32,52,92,.92)}
.st-go button:active{transform:translateY(2px)}
.st-go b{display:block;font-size:clamp(18px,2.4vw,26px);margin-bottom:6px} .st-go small{display:block;font:13px/1.6 var(--kaku);opacity:.92}
.st-credit{position:fixed;right:8px;bottom:6px;font:11px/1.3 var(--kaku);color:rgba(255,255,255,.75);text-shadow:0 1px 2px #000;z-index:3;pointer-events:none}
@media(max-aspect-ratio:3/4){.st-bg1{background-position:50% 30%}.st-go{flex-direction:column;gap:12px}}

.st-wrap{position:relative;z-index:2;max-width:660px;margin:0 auto;padding-bottom:30px}
.st-roof{width:min(620px,86vw);height:70px;margin:0 auto}
.st-roof .r{height:26px;background:linear-gradient(#3a2a12,#1c140a);clip-path:polygon(6% 0,94% 0,100% 100%,0 100%)}
.st-roof .m{height:22px;background:#4b2a6b;border-bottom:3px solid #c9a24a}
.st-roof .f{display:flex;justify-content:space-between;padding:0 6%}
.st-roof .f i{display:block;width:16px;height:22px;border-radius:0 0 8px 8px}
.st-roof .f i:nth-child(1){background:#2a7a4a}.st-roof .f i:nth-child(2){background:#b3261e}.st-roof .f i:nth-child(3){background:#f4f1e8}.st-roof .f i:nth-child(4){background:#1c1c1c}
.st-h{text-align:center;font-size:clamp(28px,5vw,44px);color:#e9c46a;letter-spacing:.06em;text-shadow:0 0 18px rgba(233,196,106,.45),0 3px 6px #000;margin:8px 0 2px}
.st-back{display:block;margin:6px auto 0;background:rgba(10,8,6,.55);border:1.5px solid #e9c46a;color:#f2e8d0;border-radius:999px;padding:6px 18px;font-family:var(--kaku);font-size:14px;cursor:pointer}
.st-wrap .start{margin:14px auto 0;background:rgba(253,249,238,.96);border:2px solid #c9a24a;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.st-wrap .start h2{margin:4px 0 6px;letter-spacing:.1em}
/* v22 スキン */
.hbtns{display:flex;gap:6px}.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:3px;padding:2px 10px;font:13px/1.6 var(--kaku);min-height:30px}.hbtn:active{background:rgba(255,255,255,.25)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,15,10,.88);color:#fff;padding:8px 18px;border-radius:999px;font:14px var(--kaku);z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}#toast.on{opacity:1}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.skins button{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:8px;font:14px var(--kaku);color:var(--sumi);min-height:48px;text-align:left}.skins button.on{border-color:var(--shu);box-shadow:0 0 0 2px var(--shu) inset}.skins i{display:inline-flex;width:42px;height:28px;border-radius:3px;overflow:hidden;flex:none;border:1px solid rgba(0,0,0,.2)}.skins i b{flex:1}

/* v23 受け持つ部屋のカード */
.st-wrap.wide{max-width:1100px}
.hlead{color:#f2e8d0;text-align:center;font:14px/1.6 var(--kaku);margin:10px 0}
.hbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.hbar>b{color:#f2e8d0;font:13px var(--kaku);margin-right:2px}
.hchip{background:rgba(10,8,6,.55);border:1.5px solid #c9a24a;color:#f2e8d0;border-radius:999px;padding:5px 12px;font:14px var(--kaku);cursor:pointer}
.hchip.on{background:#c9a24a;color:#1d1a16;font-weight:bold}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hcard{background:rgba(253,249,238,.97);border:1.5px solid #c9a24a;border-radius:6px;padding:10px 12px;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.4);color:#1d1a16;font-family:var(--min);cursor:pointer}
.hcard:active{transform:translateY(1px)}
.hcard .t{display:flex;align-items:center;gap:6px}.hcard .t b{font-size:22px;letter-spacing:.08em}.hcard .t .hfr{margin-left:auto}
.hcard .s{font:13px/1.6 var(--kaku);color:#4a443b;margin-top:4px}
.hcard .n{display:flex;gap:12px;align-items:center;font:13px var(--kaku);margin-top:6px}.hcard .n em{font-style:normal;font-size:20px;font-weight:bold;color:#b5361f;margin-right:2px}
.hic{display:inline-block;color:#fff;border-radius:3px;padding:0 6px;font:12px/1.7 var(--kaku);white-space:nowrap}
.hic.i0{background:#2c3e5c}.hic.i1{background:#3f6b4a}.hic.i2{background:#8a5a1a}.hic.i3{background:#6b2e6b}.hic.i4{background:#b5361f}
.hfr{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font:bold 14px var(--kaku);color:#fff;flex:none}
.hfr.S{background:#b8892c}.hfr.A{background:#b5361f}.hfr.B{background:#2c3e5c}.hfr.C{background:#5a6b5a}.hfr.D{background:#7d7365}
.hlv{font:12px var(--kaku);padding:1px 8px;border-radius:999px;white-space:nowrap;margin-left:auto}
.hlv.e{background:#fbe0c8;color:#8a3a10}.hlv.n{background:#e3e8f0;color:#2c3e5c}.hlv.h{background:#e8e2d6;color:#5a4a33}
#hcover{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;display:none}#hcover.on{display:block}
#hsheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(105%);transition:transform .25s;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
#hsheet.on{transform:none}
#hsheet .in{max-width:760px;margin:0 auto;background:#fffaf0;color:#1d1a16;border:2px solid #c9a24a;border-radius:10px 10px 6px 6px;box-shadow:0 -6px 24px rgba(0,0,0,.5);padding:14px 16px;max-height:78vh;overflow:auto}
#hsheet h2{font-size:24px;letter-spacing:.1em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;border:0;padding:0}
#hsheet .x{margin-left:auto;background:none;border:1px solid #b9a988;border-radius:4px;padding:2px 10px;font:14px var(--kaku);color:#1d1a16}
#hsheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font:14px/1.6 var(--kaku)}
#hsheet dt{color:#7d7365;white-space:nowrap}#hsheet dd{margin:0}
#hsheet label{display:block;font:13px var(--kaku);color:#4a443b;margin:4px 0}
#hsheet select{width:100%;background:#fffdf7;color:#1d1a16;border-color:#b9a988}
#hsheet .btn.main{display:block;width:100%;margin-top:10px;font-size:20px}
#hsheet h2 .hlv{margin-left:0}
body.hs-open .st-credit{display:none}

/* v25 スタート画面の「画面の色」 */
.st-tr{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:4;display:flex;gap:6px}.st-tr .st-upd{position:static}
#scover{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}#scover.on{display:block}
#ssheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .25s;padding:0 10px calc(10px + env(safe-area-inset-bottom))}#ssheet.on{transform:none}
#ssheet .in{max-width:820px;margin:0 auto;background:#fffaf0;color:#1d1a16;border:2px solid #c9a24a;border-radius:10px 10px 6px 6px;box-shadow:0 -6px 24px rgba(0,0,0,.5);padding:14px 16px;max-height:80vh;overflow:auto}
#ssheet h2{font-size:20px;letter-spacing:.1em;display:flex;align-items:center;margin:0}#ssheet h2 button{margin-left:auto;background:none;border:1px solid #b9a988;border-radius:4px;padding:2px 10px;font:14px var(--kaku);color:#1d1a16}
#ssheet p{font:13px var(--kaku);color:#7d7365;margin:4px 0 10px}
.skpv{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.skpv button{flex:none;width:150px;scroll-snap-align:start;background:#fff;border:2px solid #d8c9a6;border-radius:8px;padding:6px;font:14px var(--kaku);color:#1d1a16;text-align:center}
.skpv img{display:block;width:100%;border-radius:4px;margin-bottom:4px;border:1px solid #ddd}
.skpv button.on{border-color:#b5361f;box-shadow:0 0 0 2px #b5361f inset}

/* v26 経歴(タブ+経歴カード) */
.rtabs{display:flex;margin:14px 0 0;border-bottom:2px solid var(--ai)}
.rtabs button{flex:1;font:15px var(--kaku);padding:9px 4px;background:transparent;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;color:var(--mute);min-height:42px}
.rtabs button.on{background:var(--ai);color:#fff;border-color:var(--ai)}
.rtbx{border:1px solid var(--line);border-top:none;padding:10px 12px 12px}
.rtbx>h3:first-child{margin-top:4px}
.kc{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:10px 12px;font-family:var(--kaku)}
.kc .home{font-size:15px}.kc .home:before{content:"◆ ";color:var(--shu)}
.kc .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.kc .chip{border:1.5px solid var(--ai);border-radius:999px;padding:3px 10px;font-size:13px}
.kc .chip i{font-style:normal;font-size:11px;color:#fff;background:var(--ai);border-radius:999px;padding:0 6px;margin-right:5px}
.kc .amal{font-size:13px;line-height:1.9}
.kc .md{display:inline-block;min-width:34px;text-align:center;font:bold 11px/18px var(--kaku);border-radius:9px;margin-right:6px;color:#fff;vertical-align:1px}
.kc .md.g{background:#b8901f}.kc .md.s{background:#8c8f96}.kc .md.b{background:#9a5b2c}.kc .md.n{background:#a99c82}
.kc .tree{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.kc .tree .me{border:2px solid var(--shu);padding:4px 10px;border-radius:4px;font-weight:700}
.kc .tree .fm{border:1px solid var(--line);padding:3px 8px;border-radius:4px;font-size:13px}.kc .tree .fm small{display:block;font-size:10px;color:var(--mute)}
.kc a.lk{color:var(--ai);text-decoration:underline}
.kc .src{font-size:11px;color:var(--mute);margin-top:8px}
a.tlk{color:var(--ai);text-decoration:underline}

 else if(me().age>=63&&!me().warn){me().warn=1;addNews('親方は '+Math.floor(me().age)+' 歳。定年(65 歳)が近づいています。年寄名跡を持つ部屋付き親方を育てておきましょう。');}
 const pool=['party','donate','sick','media','chanko','star'].concat(me().ic>=0?['joint']:[]);
 const n=Math.random()<.5?1:2;

 {const nb=G.bnum%6;if(CHI[nb]&&Math.random()<.6&&!G.ev.some(e=>e.k==='chiho'))G.ev.push({k:'chiho',bi:nb});}
 if(Math.random()<.18){const e={k:'kika'};if(EVT.kika.init(e)!==false)G.ev.push(e);}

function gg(v,cls,lab){return '<span class="gg '+(cls||'')+'" title="'+(lab||'')+'"><i style="width:'+cl(v,0,100)+'%"></i></span>';}
function condG(r){return gg(r.cond,r.cond>=70?'g':r.cond<35?'r':'','調子 '+Math.round(r.cond));}
function fatG(r){return gg(r.fat,r.fat>=70?'r':r.fat>=45?'y':'g2','疲労 '+Math.round(r.fat));}
function condWord(r){return r.cond>=80?'絶好調':r.cond>=65?'好調':r.cond>=40?'普通':r.cond>=25?'不調':'絶不調';}
function fatWord(r){return r.fat>=75?'疲労困憊':r.fat>=55?'疲れ気味':r.fat>=30?'普通':'元気';}
function injTag(r){return r.inj?'<span class="tag inj">'+r.inj.p+'・'+SEV[r.inj.s]+'</span>':'';}
function ac(v){return v>=16?'a4':v>=11?'a3':v>=6?'a2':'a1';}
function kn(r){return r.h===0?r.kn:0;}
function potRange(r){const e=(100-kn(r))/25;const p=potOf(r);return [Math.max(ovr(r),p-e),Math.min(20,p+e)];}
function potTxt(r){const [a,b]=potRange(r);return b-a<.6?gradeOf((a+b)/2)+'('+f1((a+b)/2)+')':gradeOf(a)+(gradeOf(a)!==gradeOf(b)?'〜'+gradeOf(b):'')+'('+f1(a)+'〜'+f1(b)+')';}
function spark(vals,w,h,col,lo,hi){if(vals.length<2)return '<span class="mute kaku" style="font-size:12px">記録がたまると表示されます</span>';
 lo=lo!=null?lo:Math.min(...vals);hi=hi!=null?hi:Math.max(...vals);if(hi-lo<1e-6){hi=lo+1;}
 const pts=vals.map((v,i)=>(i*(w-4)/(vals.length-1)+2).toFixed(1)+','+(h-2-(v-lo)/(hi-lo)*(h-4)).toFixed(1)).join(' ');
 return '<svg class="spk" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+h+'px"><polyline fill="none" stroke="'+col+'" stroke-width="2" points="'+pts+'"/></svg>';}
function selH(opts,cur,on){return '<select onchange="'+on+'">'+opts.map(([v,t])=>'<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+t+'</option>').join('')+'</select>';}

function heyaList(){if(heyaList._c)return heyaList._c;const RK={Y:'横綱',O:'大関',S:'関脇',K:'小結'};
 heyaList._c=REALH.map(x=>{const n=x[0],ws=[];REALB.forEach((l,i)=>{const f=l.split('|');if(f[3]===n)ws.push([i,f[0],f[1]]);});
  const sk=ws.filter(w=>w[0]<70).length,tp=ws[0];const topr=tp?(RK[tp[1]]||(tp[0]<42?'前頭':tp[0]<70?'十両':tp[0]<190?'幕下':tp[0]<350?'三段目':'序二段以下')):'';
  const t=TOSHI.find(r=>r[2]===n&&r[3]===1);const mb=t?t[5]:(RK[x[4]]||'力士');const mbs=/横綱/.test(mb)?5:/大関/.test(mb)?3:/関脇/.test(mb)?1:0;
  const d=HEYAD[n]||['',0,''];const hf=HFIN[n];const sc=sk*3+ws.length*.3+mbs+(d[1]&&d[1]<1950?3:d[1]&&d[1]<1990?1:0)+(hf&&hf[3]?1:0);
  const oya=TOSHI.filter(r=>r[2]===n&&r[3]!==1).length;const post=t&&/理事|監事|役員待遇/.test(t[1])?t[1]:'';
  return {n:n,ic:x[1],m:x[2],age:x[3],mb:mb,post:post,c:ws.length,sk:sk,top:tp?tp[2]:'',topr:topr,loc:d[0],est:d[1],hist:d[2],fr:finRank(sc),money:Math.round(800+sc*110),oya:oya};});
 return heyaList._c;}

/* アプリの更新:同じフォルダの latest.json に最新の版と本体のファイル名を書いておく */
function checkUpd(manual){
 if(!/^https?:/.test(location.protocol)){if(manual)alertM('更新を確かめられません','ファイルから直接開いているときは確かめられません。https://mk70dog.github.io/sumo/ から開いてください。');return;}
 if(navigator.onLine===false){if(manual)alertM('更新を確かめられません','ネットにつながっていないため確かめられません。いまの版(v'+APPV+')のまま遊べます。');return;}
 fetch('latest.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
  if(j&&j.v>APPV&&j.file){UI.upd=j;if(manual)askUpd();else render();}
  else if(manual)alertM('最新の版です','いまの版は v'+APPV+' です。');
 }).catch(()=>{if(manual)alertM('更新を確かめられません','インターネットにつながっているか確かめてください。');});}

function skinSheet(){const c=skinNow();$('#ssheet .in').innerHTML='<h2>画面の色(スキン)<button onclick="skinClose()">閉じる</button></h2><p>ゲームの画面がどう見えるかを見て選べます。横にすべらせてください。この端末だけの設定で、保存データには影響しません。</p><div class="skpv">'+
 SKINS.map(x=>'<button class="'+(x[0]===c?'on':'')+'" onclick="skinPick(\''+x[0]+'\')"><img src="'+SKIMG[x[0]]+'" alt="">'+x[1]+'</button>').join('')+'</div>';
 $('#ssheet').classList.add('on');$('#scover').classList.add('on');document.body.classList.add('hs-open');}
function skinPick(k){try{localStorage.setItem('sumoSkin',k);}catch(e){}applySkin(k);const sk=SKINS.find(x=>x[0]===k);toast('「'+sk[1]+'」にしました');skinSheet();}
function skinClose(){const a=$('#ssheet'),b=$('#scover');if(a)a.classList.remove('on');if(b)b.classList.remove('on');document.body.classList.remove('hs-open');}
function goStart(k){if(k==='cont'){UI.title=false;UI.start=null;}else UI.start=k;render();window.scrollTo(0,0);}
function doStartReal(){UI.start=null;UI.title=false;newGameReal($('#r_h').value,$('#r_t').value);save();UI.view='home';render();}
function doStart(){UI.start=null;UI.title=false;const h=($('#s_h').value||'東雲').trim(),o=($('#s_o').value||h).trim(),p=($('#s_p').value||h[0]).trim();newGame(h,o,p,$('#s_t').value,+$('#s_ic').value,+$('#s_a').value);save();UI.view='home';render();}
function resetGame(){try{localStorage.removeItem(SAVE);localStorage.setItem(SAVE+'x','1');}catch(e){}G=null;UI.view='home';UI.start=null;UI.title=false;render();}
/* --- 部屋 --- */
function weekDots(){return '<div class="daybar">'+Array.from({length:WEEKS},(_,i)=>'<i class="'+(i<G.wk-1?'d':'')+'"></i>').join('')+'</div>';}
function homeHTML(){
 let h='';
 if(G.phase==='train'){
  if(G.wk===1&&G.news.length)h+='<div class="pn"><h2>'+bname(G.bnum)+' 番付発表</h2><div class="hl">'+G.news.map(esc).join('<br>')+'</div></div>';
  h+='<div class="pn"><h2>稽古 第'+G.wk+'週<span class="sub">'+bname(G.bnum)+'('+MONTH[(G.bnum-1)%6]+'月・'+CITY[(G.bnum-1)%6]+')の初日まであと '+(WEEKS-G.wk+1)+' 週</span></h2>'+'<div class="sdq" style="margin-left:0">'+esc(oyN())+'(ひとりごと)「今週の稽古は、どうするか…。」</div>'+weekDots()+tourNote()+
  '<p class="kaku" style="margin:6px 0">「稽古」で弟子ごとの稽古と強さを決めて、1 週ずつ進めます。'+(G.wk>=WEEKS-1?'<b class="shu">初日が近づいています。軽めの稽古で疲れを抜くと、調子の良い状態で場所を迎えられます。</b>':'')+'</p>'+
  '<div class="btns"><button class="btn main" onclick="doWeekUI()">1 週間を過ごす</button><button class="btn ai" onclick="doToBasho()">初日まで進める</button><button class="btn" onclick="go(\'keiko\')">稽古を決める</button></div></div>';
  if(G.ev.length)h+='<div class="pn"><h2>親方の悩みごと<span class="sub">初日までに決めてください</span></h2>'+G.ev.map(e=>{const E=EVT[e.k];return evHead(e,E)+'<div class="btns">'+(typeof E.c==='function'?E.c(e):E.c).map((c,i)=>'<button class="btn sm'+(i===0?' ai':'')+'" onclick="doEv(\''+e.id+'\','+i+')">'+c+'</button>').join('')+'</div></div>';}).join('')+'</div>';
  h+='<div class="pn"><h2>部屋の声<span class="sub">押すと話が聞けます</span></h2><div class="kp">'+koePeople().map((p,i)=>'<button onclick="koeModal('+i+')">'+esc(p.who)+' <small>'+esc(p.role)+'</small></button>').join('')+'</div></div>';
  h+='<div class="pn"><h2>弟子の様子<span class="sub">押すと詳しく見られます</span></h2>'+ownTable()+'</div>';
 }else if(G.phase==='basho'){
  h+='<div class="pn"><h2>本場所の最中です<span class="sub">'+(G.B.day?G.B.day+'日目まで終了':'初日前')+'</span></h2><button class="btn main" onclick="go(\'basho\')">本場所の画面へ</button></div>';
 }else if(G.phase==='post'){
  const L=G.last;
  h+='<div class="pn"><h2>'+bname(G.bnum)+' 場所を終えて</h2>';
  h+='<h3>部屋の成績</h3><table class="tb"><tr><th>番付</th><th>四股名</th><th>成績</th><th></th></tr>'+L.own.map(o=>'<tr class="clk" onclick="showR('+o.id+')"><td>'+esc(o.rk)+'</td><td class="nm">'+esc(o.n)+'</td><td class="wl">'+o.w+'勝'+o.l+'敗'+(o.ab?o.ab+'休':'')+'</td><td>'+(o.kk?'<span class="tag mid">勝ち越し</span>':'<span class="tag shu">負け越し</span>')+'</td></tr>').join('')+'</table>';
  h+='<h3>各段の優勝</h3><div class="kaku">'+L.yu.map(y=>'<div>'+DN[y.d]+':<b class="'+(y.h===0?'shu':'')+'">'+esc(y.n)+'</b>('+esc(y.rk)+'・'+esc(G.heya[y.h].n)+')'+y.w+'勝'+y.l+'敗'+(y.po?' 決定戦':'')+'</div>').join('')+'</div>';
  if(L.sansho.length)h+='<h3>三賞</h3><div class="kaku">'+L.sansho.map(s=>'<div>'+s.t+':<b class="'+(s.h===0?'shu':'')+'">'+esc(s.n)+'</b>('+esc(s.rk)+')</div>').join('')+'</div>';
  h+='<h3>今場所の収支</h3>'+finHTML(L.fin)+'</div>';
  if(G.ev.length)h+='<div class="pn"><h2>親方の悩みごと<span class="sub">決めると次へ進めます</span></h2>'+G.ev.map(e=>{const E=EVT[e.k];return evHead(e,E)+'<div class="btns">'+(typeof E.c==='function'?E.c(e):E.c).map((c,i)=>'<button class="btn sm'+(i===0?' ai':'')+'" onclick="doEv(\''+e.id+'\','+i+')">'+c+'</button>').join('')+'</div></div>';}).join('')+'</div>';
  h+='<div class="pn"><h2>次の場所へ</h2><p class="kaku">番付が発表され、次の場所までの 6 週の稽古期間に入ります。新弟子の勧誘やスタッフの入れ替えもこの間にできます。</p><div class="btns"><button class="btn main" '+(G.ev.length?'disabled':'')+' onclick="doNext()">番付発表へ進む</button><button class="btn" onclick="go(\'scout\')">新弟子</button><button class="btn" onclick="go(\'staff\')">スタッフ</button></div></div>';
 }
 const seki=own().filter(r=>r.d<=1);
 h+='<div class="grid2"><div class="pn"><h2>部屋の様子</h2><dl class="kv"><dt>関取</dt><dd>'+(seki.map(r=>esc(r.n)+'('+esc(r.rkS)+')').join('、')||'まだいません')+'</dd><dt>スタッフ</dt><dd>'+(Object.keys(ROLE).map(k=>{const n=G.staff.filter(s=>s.role===k).length;return n?ROLE[k].n+' '+n:'';}).filter(x=>x).join('・')||'なし')+'</dd><dt>施設</dt><dd>'+Object.keys(FAC).map(k=>FAC[k].n+G.fac[k]).join('・')+'</dd><dt>達成</dt><dd>'+G.ach.length+' 個</dd></dl></div>'+
 '<div class="pn"><h2>部屋日誌</h2><div class="log">'+G.log.slice(0,40).map(l=>'<div>'+esc(l)+'</div>').join('')+'</div></div></div>';
 return h;

function oRes(b){const W=G.R[b.w],L=G.R[b.l];const m=W.h===0?W:L,o=m===W?L:W,win=m===W;const c=G.B.rec[m.id];const half=Math.floor(c.nb/2)+1;

 let tag='';if(win&&c.w===half)tag='勝ち越し!';else if(!win&&c.l===half)tag='負け越し';else if(st>=3)tag=st+'連勝';else if(st<=-3)tag=(-st)+'連敗';

 return '<div class="pn"><h2>給金番付<span class="sub">持ち給金の多い順</span></h2><p class="kaku mute" style="font-size:13px">持ち給金は入門時の 3 円から、勝ち越し 1 つで 0.5 円、金星 10 円、幕内優勝 30 円(全勝 50 円)が加わり、減ることはありません。関取の間は、その 4000 倍が褒賞金として場所ごとに支給されます。</p><table class="tb">'+L.map((r,i)=>'<tr class="'+(r.h===0?'me':'')+'"><td>'+(i+1)+'</td><td class="nm">'+esc(r.n)+'</td><td>'+esc(r.rkS)+'</td><td class="num">'+r.mkg+' 円</td></tr>').join('')+'</table></div>';}
function hlogPanel(){const L=G.hlog||[];return '<div class="pn"><h2>角界の部屋<span class="sub">現在 '+(openAI().length+1)+' 部屋</span></h2>'+(L.length?'<table class="tb">'+L.slice(0,15).map(x=>'<tr><td>'+bname(x.b)+'</td><td>'+esc(x.t)+'</td></tr>').join('')+'</table>':'<p class="mute kaku">部屋の独立・閉鎖・合併はまだありません。</p>')+'</div>';}
function okamiPanel(){const o=G.okami;if(!o)return '';const a=Math.round(atmo());
 const sk=[['chk','ちゃんこ・生活'],['koen','後援・挨拶'],['keiri','経理'],['hito','人柄・目配り']];
 return '<div class="pn"><h2>おかみさん<span class="sub">'+esc(o.n)+'・'+Math.floor(o.age)+'歳</span></h2><div class="sks">'+sk.map(x=>'<span class="sk">'+x[1]+' '+o.sk[x[0]]+'</span>').join('')+'</div>'+
 '<dl class="kv" style="margin-top:8px"><dt>親方の評判</dt><dd>'+Math.round(G.jin==null?50:G.jin)+' / 100(弟子の親や学校の監督のあいだの評判。勧誘に効きます)</dd><dt>部屋の雰囲気</dt><dd>'+a+' / 100('+(a>=65?'和やか':a>=45?'ふつう':'ぎすぎす')+')</dd><dt>協会の役職</dt><dd>'+(G.post?POSTN[G.post]+'(任期 2 年)':'なし')+(me().ic<0?'(一門に入ると、理事選に出られます)':'')+'</dd></dl>'+
 '<p class="kaku mute" style="font-size:13px">おかみさんは、ちゃんこの工夫(栄養)、後援会の増え方、部屋の切り盛り、弟子の信頼と不祥事の防止に効きます。雰囲気が良いと稽古の効果が少し上がります。理事は巡業の収入が 2 割、理事長は 3 割増えます。ただし、協会の仕事で稽古に目が届きにくくなります。親方の定年のとき、おかみさんが部屋を 1 年だけ預かることができます(1 回だけ)。</p></div>';}
function scPanel(){const L=G.scl||[];return '<div class="pn"><h2>不祥事の記録</h2>'+(L.length?'<table class="tb">'+L.slice(0,12).map(x=>'<tr><td>'+bname(x.b)+'</td><td class="nm">'+esc(x.n)+'</td><td>'+esc(x.t)+'</td><td>'+esc(x.a)+'</td></tr>').join('')+'</table>':'<p class="mute kaku">まだありません。</p>')+'</div>';}
function hsPanel(){const hs=G.hs;
 if(!hs||!hs.last.length)return '<div class="pn"><h2>部屋番付</h2><p class="mute kaku">場所が終わると表示されます。</p></div>';
 const tbl=(arr,lab)=>{const o=arr.map((v,i)=>[i,v]).filter(x=>G.heya[x[0]]&&!G.heya[x[0]].closed).sort((a,b)=>b[1]-a[1]||a[0]-b[0]);const rk=o.findIndex(x=>x[0]===0)+1;
  return '<h3>'+lab+'(自部屋 '+rk+' 位)</h3><table class="tb">'+o.slice(0,10).map((x,j)=>'<tr class="'+(x[0]===0?'me':'')+'"><td>'+(j+1)+'</td><td class="nm">'+esc(G.heya[x[0]].n)+'</td><td class="num">'+Math.round(x[1])+'</td></tr>').join('')+(rk>10?'<tr class="me"><td>'+rk+'</td><td class="nm">'+esc(G.heya[0].n)+'</td><td class="num">'+Math.round(arr[0])+'</td></tr>':'')+'</table>';};
 const Y=G.yr.slice(-10).reverse();
 return '<div class="pn"><h2>部屋番付<span class="sub">幕内・十両の成績の得点</span></h2><div class="grid2"><div>'+tbl(hs.last,'前の場所')+'</div><div>'+tbl(hs.yr,'今年(暫定)')+'</div></div><div class="grid2"><div>'+tbl(hs.tot,'通算')+'</div><div><h3>年間評価</h3>'+
 (Y.length?'<table class="tb"><tr><th>年</th><th>順位</th><th>評価</th><th>関取</th><th>弟子</th></tr>'+Y.map(y=>'<tr><td>'+y.y+'年目</td><td class="num">'+y.rk+'位</td><td><b>'+y.g+'</b></td><td class="num">'+y.sk+'</td><td class="num">'+y.di+'</td></tr>').join('')+'</table>':'<p class="mute kaku">九州場所のあとに、年間評価が出ます。</p>')+'</div></div></div>';}
function intvPanel(){const L=(G.intv||[]).slice(0,12);
 return '<div class="pn"><h2>取材の記事</h2>'+(L.length?'<table class="tb"><tr><th>場所</th><th>力士</th><th>答え</th><th>反響</th></tr>'+L.map(x=>'<tr><td>'+bname(x.b)+'</td><td class="nm">'+esc(x.n)+'</td><td>'+x.a+'</td><td>'+esc(x.r)+'</td></tr>').join('')+'</table>':'<p class="mute kaku">まだありません。</p>')+'</div>';}
/* --- モーダル --- */
function openM(h){$('#mbox').innerHTML=h;$('#mdl').classList.add('on');}
function closeM(){$('#mdl').classList.remove('on');}
function alertM(t,d){openM('<h2>'+esc(t)+'</h2><p class="kaku">'+esc(d)+'</p><button class="btn main" onclick="closeM()">わかった</button>');}
$('#mdl').addEventListener('click',e=>{if(e.target.id==='mdl')closeM();});
/* 起動 */
G=load();
if(G&&!G.order)G=null;
UI.title=!!G;
if(G&&!G.ama)amaInit();
applyMode(!!(G&&G.real));
applySkin(skinNow());
render();
checkUpd(0);
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});}
</script>
