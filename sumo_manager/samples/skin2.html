<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スキンの見本 2</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;color:#fff;overflow:hidden;background:#111}
.k{font-family:"Hiragino Sans","Noto Sans JP",sans-serif}button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tag{position:fixed;left:8px;bottom:6px;font:12px sans-serif;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:3px;z-index:30}
.bg{position:fixed;inset:0;background:#111 url(../img/start_dohyoiri.jpg) center 40%/cover}
.bg:after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,0) 35%,rgba(0,0,0,.75))}
.title{position:fixed;top:6%;left:50%;transform:translateX(-50%);text-align:center;z-index:2;width:92vw}
.title h1{display:inline-block;background:#b3261e;border:3px solid #f3e3c3;padding:10px 22px;font-size:clamp(28px,5.5vw,58px);letter-spacing:.06em;line-height:1.3;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.title p{display:inline-block;margin-top:10px;font-size:clamp(15px,2.2vw,22px);letter-spacing:.4em;padding:4px 10px 4px 16px;background:rgba(0,0,0,.6);border-radius:3px}
.go{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:12px 18px;width:min(900px,92vw);z-index:2}
.go button{flex:1;padding:16px;border:2px solid #f3e3c3;color:#fff;text-align:left;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.go .c{flex:1 1 100%;background:rgba(20,16,10,.88);border-color:#e9c46a;text-align:center;padding:10px}.go .c b{color:#e9c46a}
.go .r{background:rgba(179,38,30,.92)}.go .n{background:rgba(32,52,92,.92)}
.go b{display:block;font-size:clamp(18px,2.4vw,24px);margin-bottom:4px}.go small{display:block;font:13px/1.6 "Hiragino Sans",sans-serif;opacity:.92}
.upd{position:fixed;top:8px;right:8px;z-index:4;background:rgba(10,8,6,.6);border:1.5px solid #e9c46a;color:#f2e8d0;border-radius:999px;padding:5px 14px;font:13px/1.4 "Hiragino Sans",sans-serif}
.credit{position:fixed;right:8px;bottom:6px;display:none;font:11px sans-serif;color:rgba(255,255,255,.75);z-index:3}
@media(max-aspect-ratio:3/4){.go{flex-direction:column}}
.sw{display:inline-flex;width:34px;height:22px;border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.5);flex:none}.sw b{flex:1}

.tr{position:fixed;top:8px;right:8px;z-index:4;display:flex;gap:6px}.tr .upd{position:static}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,15,10,.9);color:#fff;padding:10px 20px;border-radius:999px;font:15px sans-serif;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
.dots{position:fixed;left:50%;bottom:calc(7% - 44px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:3;background:rgba(0,0,0,.55);padding:5px 12px;border-radius:999px;font:13px "Hiragino Sans",sans-serif;white-space:nowrap}
.dots button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.6);padding:0;overflow:hidden;display:flex}.dots button b{flex:1}
.dots button.on{border-color:#e9c46a;box-shadow:0 0 0 2px #e9c46a}
.go{bottom:calc(7% + 8px)}.credit{display:none}</style></head><body><div class="tag">見本 2:ボタンの下に色の丸</div><div class="bg"></div><div class="title"><h1>Sumo Manager</h1><br><p>親方一代</p></div><div class="go"><button class="c"><b>続きから</b><small>藤島部屋・2026年 九州場所・稽古 第1週</small></button><button class="r"><b>実在の部屋を選ぶ</b><small>2026 年九州場所の番付から。45 部屋・592 人の中から選びます。</small></button><button class="n"><b>新しく部屋を作る</b><small>自分で部屋を開きます。弟子 7 人から始めます。</small></button></div><div class="credit">背景:一恵斎芳幾「勧進大相撲土俵入之図」ほか</div><div id="toast"></div><button class="upd">アプリを更新(v24)</button><div class="dots" id="d"></div><script>
const SK=[["std", "和紙(標準)", ["#1d1a16", "#fbf8f1", "#b5361f"]], ["yoru", "墨の夜", ["#000000", "#24201a", "#e0583c"]], ["ai", "藍染め", ["#13284d", "#f7f9fc", "#b23a2a"]], ["sakura", "桜", ["#6b2e45", "#fffafb", "#c2405a"]], ["nishiki", "錦絵", ["#a01f14", "#fffaee", "#4b2a6b"]], ["banzuke", "番付(白黒)", ["#000000", "#ffffff", "#b00000"]]];let cur='std';
const sw=x=>'<span class="sw">'+x[2].map(c=>'<b style="background:'+c+'"></b>').join('')+'</span>';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1400);}
function pick(k){cur=k;const x=SK.find(s=>s[0]===k);toast('「'+x[1]+'」にしました(見本)');if(window.draw)draw();}
window.draw=()=>{document.getElementById('d').innerHTML='画面の色 '+SK.map(x=>'<button title="'+x[1]+'" class="'+(x[0]===cur?'on':'')+'" onclick="pick(\''+x[0]+'\')">'+x[2].map(c=>'<b style="background:'+c+'"></b>').join('')+'</button>').join('');};draw();</script></body></html>
