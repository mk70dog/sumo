<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sumo Manager スタート画面 見本 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;color:#fff;overflow:hidden;background:#111}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.credit{position:fixed;right:8px;bottom:6px;font:11px/1.3 sans-serif;color:rgba(255,255,255,.75);text-shadow:0 1px 2px #000;z-index:9}
.tag{position:fixed;left:8px;top:8px;font:12px sans-serif;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:3px;z-index:9}

body{background:#efe6d2;color:#2b1d12}
.bg{position:fixed;inset:0;background:url(../img/nishikie_dohyoiri.jpg) center/cover;opacity:.22;filter:sepia(.4)}
.board{position:relative;z-index:2;margin:5vh auto 0;width:min(760px,92vw);background:#fbf6ea;border:6px double #3b2a1a;padding:28px 24px 26px;text-align:center;box-shadow:0 10px 30px rgba(60,40,10,.25)}
.board .mon{font-size:14px;letter-spacing:.6em;color:#8a2a1e}
.board h1{font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:.04em;margin:6px 0 2px;color:#1f140b;text-shadow:1px 1px 0 #cdb98f}
.board .sub{font-size:16px;letter-spacing:.5em;border-top:2px solid #3b2a1a;border-bottom:2px solid #3b2a1a;display:inline-block;padding:4px 14px;margin-top:6px}
.fuda{display:flex;gap:22px;justify-content:center;margin-top:26px}
.fuda button{width:min(300px,42vw);background:linear-gradient(#d9b98a,#c49a63);border:2px solid #5a3b1d;color:#2b1d12;padding:18px 14px 16px;border-radius:4px 4px 14px 14px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),0 6px 12px rgba(60,40,10,.3)}
.fuda b{display:block;font-size:22px;letter-spacing:.12em;margin-bottom:8px} .fuda small{font:13px/1.6 sans-serif;color:#3d2a17}
.note{margin-top:18px;font:12px sans-serif;color:#6b5636}
@media(max-width:600px){.fuda{flex-direction:column;align-items:center}.fuda button{width:100%}}
.credit{color:#5b4a33;text-shadow:none}

</style></head><body><div class="tag">見本 2:番付表</div>
<div class="bg"></div><div class="board"><div class="mon">蒙 御 免</div><h1>Sumo Manager</h1><div class="sub">親 方 一 代</div><div class="fuda"><button data-go="real"><b>実在の部屋を選ぶ</b><small>2026 年九州場所の番付から。45 部屋・592 人の中から部屋を選び、その師匠になります。</small></button><button data-go="new"><b>新しく部屋を作る</b><small>自分で部屋を開きます。部屋の名前・親方・一門を決め、弟子 7 人から始めます。</small></button></div><div class="note">セーブデータがあれば「続きから」を上に出します</div></div><div class="credit">背景:一恵斎芳幾「勧進大相撲土俵入之図」ほか(江戸〜明治の錦絵)</div>
<script>document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>alert(b.dataset.go==='real'?'実在の部屋を選ぶ画面へ進みます(見本)':'新しい部屋を作る画面へ進みます(見本)'));</script></body></html>
