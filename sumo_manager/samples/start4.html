<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sumo Manager スタート画面 見本 4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;color:#fff;overflow:hidden;background:#111}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.credit{position:fixed;right:8px;bottom:6px;font:11px/1.3 sans-serif;color:rgba(255,255,255,.75);text-shadow:0 1px 2px #000;z-index:9}
.tag{position:fixed;left:8px;top:8px;font:12px sans-serif;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:3px;z-index:9}

.bg{position:fixed;inset:-20px;background:url(../img/nishikie_torikumi.jpg) center/cover;filter:blur(3px) brightness(.45) saturate(1.1)}
.roof{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(620px,86vw);height:70px;z-index:2}
.roof .r{height:26px;background:linear-gradient(#3a2a12,#1c140a);clip-path:polygon(6% 0,94% 0,100% 100%,0 100%)}
.roof .m{height:22px;background:#4b2a6b;border-bottom:3px solid #c9a24a}
.roof .f{display:flex;justify-content:space-between;padding:0 6%}
.roof .f i{display:block;width:16px;height:22px;border-radius:0 0 8px 8px}
.roof .f i:nth-child(1){background:#2a7a4a}.roof .f i:nth-child(2){background:#b3261e}.roof .f i:nth-child(3){background:#f4f1e8}.roof .f i:nth-child(4){background:#1c1c1c}
.c{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;padding:90px 16px 40px;text-align:center}
.c h1{font-size:clamp(34px,6vw,66px);color:#e9c46a;letter-spacing:.06em;text-shadow:0 0 18px rgba(233,196,106,.45),0 3px 6px #000}
.c .sub{letter-spacing:.6em;color:#f2e8d0;margin:6px 0 28px}
.g{display:flex;gap:18px;width:min(820px,94vw)}
.g button{flex:1;background:rgba(10,8,6,.55);border:1.5px solid #e9c46a;color:#f2e8d0;padding:20px 16px;border-radius:999px;transition:.2s}
.g button:hover{background:rgba(233,196,106,.18)}
.g b{display:block;font-size:20px;color:#e9c46a;margin-bottom:4px}.g small{font:12px/1.6 sans-serif}
@media(max-width:640px){.g{flex-direction:column}.g button{border-radius:14px}}

</style></head><body><div class="tag">見本 4:夜の国技館</div>
<div class="bg"></div><div class="roof"><div class="r"></div><div class="m"></div><div class="f"><i></i><i></i><i></i><i></i></div></div><div class="c"><h1>Sumo Manager</h1><div class="sub">親方一代</div><div class="g"><button data-go="real"><b>実在の部屋を選ぶ</b><small>2026 年九州場所の番付から。45 部屋・592 人の中から部屋を選び、その師匠になります。</small></button><button data-go="new"><b>新しく部屋を作る</b><small>自分で部屋を開きます。部屋の名前・親方・一門を決め、弟子 7 人から始めます。</small></button></div></div><div class="credit">背景:一恵斎芳幾「勧進大相撲土俵入之図」ほか(江戸〜明治の錦絵)</div>
<script>document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>alert(b.dataset.go==='real'?'実在の部屋を選ぶ画面へ進みます(見本)':'新しい部屋を作る画面へ進みます(見本)'));</script></body></html>
