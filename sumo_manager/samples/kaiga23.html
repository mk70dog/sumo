<script>function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* --- 上から見た土俵 v3(四角の力士 B・体重で大きさ・色の変化)  kaiga16 --- */
/* 座標:土俵の中心 (0,0)、俵の内側が半径 1。東 = 左(-x)、西 = 右(+x)、正面 = 下(+y)。 */
function dhType(k){k=k||'';if(/うっちゃり|打っ棄り/.test(k))return 'uchari';if(/投げ|捻り|ひねり|掬い|すくい|網打ち|櫓|小股/.test(k))return 'nage';if(/送り/.test(k))return 'okuri';if(/はたき|叩き|引き落とし|引っ掛け|肩透かし|突き落とし|とったり/.test(k))return 'hiki';if(/突き出し|突き倒し|押し出し|押し倒し/.test(k))return 'oshi';if(/倒れ|浴びせ/.test(k))return 'taoshi';return 'yori';}
function dhRand(seed){let s=seed>>>0||1;return ()=>{s=(s*1103515245+12345)>>>0;return (s>>>8)/16777216;};}
/* P の各点:[t, cx, cy, d(2人の間の半分), 構え('tachi'|'yotsu'|'oshi'), 誰が押しているか(1=勝つ側,-1=負ける側,0)] */
function dhPlan(k,winE,seed,nE,nW){let sd=1,uchi=false;const rnd=dhRand(seed),T=dhType(k);const sg=winE?1:-1;const ang=(rnd()-.5)*1.3;const dir=[Math.cos(ang)*sg,Math.sin(ang)];
 const WN=winE?nE:nW,LN=winE?nW:nE;const P=[],ph=[];const st=T==='oshi'||(T==='hiki'&&rnd()<.6)?'oshi':'yotsu';
 const DD=st==='oshi'?.25:.2;const at=(f,a)=>[dir[0]*f-dir[1]*a,dir[1]*f+dir[0]*a];/* f=勝つ側が押す向き、a=横 */
 P.push([0,0,0,.36,'tachi',0]);ph.push([0,'仕切り。両者、手をついた']);
 P.push([.1,0,0,DD,st,0]);ph.push([.1,st==='oshi'?'立ち合い!激しい突っ張りの応酬':'立ち合い!がっぷり四つ']);
 let c=at((rnd()-.5)*.3,(rnd()-.5)*.3);P.push([.2,c[0],c[1],DD,st,0]);
 /* 攻め合い:負ける側が先に攻める場面(シーソー)を入れることがある */
 const sea=rnd()<.6||T==='uchari';let t=.2;
 if(sea){c=at(-.74,(rnd()-.5)*.6);t=.36;P.push([t,c[0],c[1],DD,st,-1]);ph.push([.27,LN+'が攻める!']);ph.push([.34,WN+'、土俵際!残った、残った!']);
  if(T!=='uchari'){c=at(-.05,(rnd()-.5)*.4);t=.5;P.push([t,c[0],c[1],DD,st,1]);ph.push([.42,WN+'、こらえて押し返す']);}}
 const zan=rnd()<.5&&T!=='uchari';
 if(zan){c=at(.76,(rnd()-.5)*.6);t+=.14;P.push([t,c[0],c[1],DD,st,1]);ph.push([t-.06,WN+'が出る!']);ph.push([t-.01,LN+'、俵に足がかかる…残った!']);c=at(.1,(rnd()-.5)*.5);t+=.12;P.push([t,c[0],c[1],DD,st,-1]);ph.push([t-.06,LN+'、回り込んで中央へ']);}
 if(!sea&&!zan){c=at(.15,(rnd()-.5)*.5);t=.45;P.push([t,c[0],c[1],DD,st,0]);ph.push([.3,'土俵中央で動かない…']);}
 /* 決着 */
 let out,how='出た';const L=P[P.length-1];const t0=L[0];const fin=Math.max(t0+.12,.82);
 if(T==='uchari'){const e=at(-.9,(rnd()-.5)*.4);P.push([fin,e[0],e[1],DD,st,-1]);ph.push([t0+.04,LN+'が一気に寄る!']);ph.push([fin-.03,WN+'、俵の上で体を入れ替えた!']);out=at(-1.36,(rnd()<.5?1:-1)*.35);ph.push([.97,k+'!'+WN+'の大逆転']);}
 else if(T==='nage'){P.push([fin,L[1],L[2],DD,st,1]);ph.push([t0+.04,WN+'、上手を引いた']);ph.push([fin-.03,'振った!']);const piv=[L[1],L[2]];sd=rnd()<.5?1:-1;uchi=rnd()<.6;if(uchi){ph.splice(ph.length-1,1);ph.push([fin+.01,'投げの打ち合い!']);ph.push([fin+.05,WN+'が振り切った!']);}const ra=Math.atan2(dir[1],dir[0])+sd*2.3;out=[piv[0]+Math.cos(ra)*.62,piv[1]+Math.sin(ra)*.62];how='倒れた';ph.push([.97,k+'!'+WN+'の勝ち']);}
 else if(T==='hiki'){sd=rnd()<.5?1:-1;const ch=[L[1]-dir[0]*.22,L[2]-dir[1]*.22];P.push([fin,ch[0],ch[1],DD,'oshi',-1]);ph.push([t0+.04,LN+'が頭を下げて一気に前へ!']);ph.push([fin+.01,WN+'、体を開いてはたいた!']);out=[ch[0]-dir[0]*.62,ch[1]-dir[1]*.62];how='落ちた';ph.push([.97,k+'!'+LN+'がばったり']);}
 else{const e=at(.93,(rnd()-.5)*.5);P.push([fin,e[0],e[1],T==='oshi'?.17:.11,T==='okuri'?'yotsu':st,1]);ph.push([t0+.04,T==='okuri'?WN+'が後ろに回った!':T==='oshi'?WN+'が一気に突き放す!':WN+'が寄って出る!']);ph.push([fin-.04,LN+'、俵に足が…']);out=at(1.4,(rnd()-.5)*.3);if(T==='taoshi')how='倒れた';ph.push([.97,k+'!'+WN+'の勝ち']);}
 return {P,out,how,T,winE,dir,ph,k,WN,LN,fin,sd,uchi};}
function dhAt(pl,t){const P=pl.P;let i=0;while(i<P.length-1&&P[i+1][0]<=t)i++;const a=P[i],b=P[Math.min(i+1,P.length-1)];const u=b[0]>a[0]?Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0]))):1;const e=u*u*(3-2*u);
 const cx=a[1]+(b[1]-a[1])*e,cy=a[2]+(b[2]-a[2])*e,d=a[3]+(b[3]-a[3])*e;const dx=pl.dir[0],dy=pl.dir[1];
 let W=[cx-dx*d,cy-dy*d],Lo=[cx+dx*d,cy+dy*d];let stance=(e<.5?a:b)[4],push=(e<.5?a:b)[5],fall=0;
 const lastT=P[P.length-1][0];
 let spin=0,flip=1,air=0;
 if(t>lastT&&pl.T==='hiki'){const u2=Math.min(1,(t-lastT)/(1-lastT));const pv=[-dy*pl.sd,dx*pl.sd];const es=Math.min(1,u2/.3);const s2=es*es*(3-2*es);W=[W[0]+pv[0]*.32*s2+dx*.04*s2,W[1]+pv[1]*.32*s2+dy*.04*s2];
  const em=Math.min(1,u2/.75);const m2=em*em*(3-2*em);const L0=Lo;Lo=[L0[0]+(pl.out[0]-L0[0])*m2,L0[1]+(pl.out[1]-L0[1])*m2];const sp=Math.max(0,Math.min(1,(u2-.35)/.4));spin=pl.sd*90*sp*sp*(3-2*sp);
  const r0=pl.winE?{E:W,W:Lo}:{E:Lo,W:W};return Object.assign(r0,{stance:'hataki',push:0,fall:0,lose:pl.winE?'W':'E',spin,flip:1,air:0,land:u2>=.75,slap:u2>.18&&u2<.5});}
 if(t>lastT&&pl.T==='nage'){let u2=Math.min(1,(t-lastT)/(1-lastT));let uc=0;if(pl.uchi){const ue=Math.min(1,u2/.45);uc=ue;const mid=[(W[0]+Lo[0])/2,(W[1]+Lo[1])/2];const an=pl.sd*3.6*ue*ue*(3-2*ue);const R=(v)=>[mid[0]+(v[0]-mid[0])*Math.cos(an)-(v[1]-mid[1])*Math.sin(an),mid[1]+(v[0]-mid[0])*Math.sin(an)+(v[1]-mid[1])*Math.cos(an)];const W0=W;W=R(W);Lo=R(Lo);const oo=R([pl.out[0]-W0[0]+W0[0],pl.out[1]-W0[1]+W0[1]]);
   if(u2<.45){const r0=pl.winE?{E:W,W:Lo}:{E:Lo,W:W};return Object.assign(r0,{stance:'yotsu',push:0,fall:0,lose:pl.winE?'W':'E',spin:0,flip:1,air:0,uchi:1});}
   u2=(u2-.45)/.55;var OUT=oo;}
  const OT=typeof OUT!=='undefined'?OUT:pl.out;const e2=u2<.75?u2/.75:1;const piv=W;const a0=Math.atan2(Lo[1]-piv[1],Lo[0]-piv[0]),a1=Math.atan2(OT[1]-piv[1],OT[0]-piv[0]);let da=a1-a0;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;const ee=e2*e2*(3-2*e2);const rr=Math.hypot(Lo[0]-piv[0],Lo[1]-piv[1])+(Math.hypot(OT[0]-piv[0],OT[1]-piv[1])-Math.hypot(Lo[0]-piv[0],Lo[1]-piv[1]))*ee;const aa=a0+da*ee;Lo=[piv[0]+Math.cos(aa)*rr,piv[1]+Math.sin(aa)*rr];spin=pl.sd*90*ee;flip=1;air=u2<.75?Math.sin(Math.PI*e2):0;fall=ee;stance='free';const r0=pl.winE?{E:W,W:Lo}:{E:Lo,W:W};return Object.assign(r0,{stance,push:0,fall:0,lose:pl.winE?'W':'E',spin,flip,air,land:u2>=.75});}
 if(t>lastT){const u2=Math.min(1,(t-lastT)/(1-lastT));const e2=1-Math.pow(1-u2,3);fall=e2;Lo=[Lo[0]+(pl.out[0]-Lo[0])*e2,Lo[1]+(pl.out[1]-Lo[1])*e2];
  if(pl.T!=='nage'){W=[W[0]+(pl.out[0]-W[0])*.2*e2,W[1]+(pl.out[1]-W[1])*.2*e2];const rw=Math.hypot(W[0],W[1]);if(rw>.9){W=[W[0]*.9/rw,W[1]*.9/rw];}}stance=pl.T==='oshi'?'oshi':'free';}
 return pl.winE?{E:W,W:Lo,stance,push:push*(1),fall,lose:'W'}:{E:Lo,W:W,stance,push:-push,fall,lose:'E'};}

/* 四角の力士(B):体重で大きさ。背中側にまわしの色の帯。 */
function dhSide(kg){return 46*Math.pow((kg||160)/160,.8);}
function dhRik(cls,col,nm,kg){const s=dhSide(kg),h=s/2;return '<g class="'+cls+'" data-h="'+h.toFixed(1)+'"><g class="rot"><g class="arms"><line class="a1" stroke="#c99a6a" stroke-width="'+Math.max(6,s*.17).toFixed(1)+'" stroke-linecap="round"/><line class="a2" stroke="#c99a6a" stroke-width="'+Math.max(6,s*.17).toFixed(1)+'" stroke-linecap="round"/><circle class="h1" r="'+Math.max(5,s*.12).toFixed(1)+'" fill="#f0c998" stroke="#5a3a1a" stroke-width="1.5"/><circle class="h2" r="'+Math.max(5,s*.12).toFixed(1)+'" fill="#f0c998" stroke="#5a3a1a" stroke-width="1.5"/><g class="bst" opacity="0"></g></g>'+
 '<rect class="aura" x="'+(-h-7)+'" y="'+(-h-7)+'" width="'+(s+14)+'" height="'+(s+14)+'" rx="10" fill="none" stroke="#ff8a1f" stroke-width="5" opacity="0"/>'+
 '<rect class="bd" x="'+(-h)+'" y="'+(-h)+'" width="'+s+'" height="'+s+'" rx="4" fill="#f0c998" stroke="#5a3a1a" stroke-width="2"/><rect x="'+(-h)+'" y="'+(-h)+'" width="'+(s*.28)+'" height="'+s+'" fill="'+col+'"/>'+
 '<ellipse cx="'+(h*.4)+'" rx="'+(s*.2)+'" ry="'+(s*.18)+'" fill="#2b2420"/><ellipse cx="'+(h*.15)+'" rx="'+(s*.12)+'" ry="'+(s*.06)+'" fill="#000"/></g>'+
 '<text class="nm" y="'+(-h-14)+'" text-anchor="middle" font-size="13" font-weight="bold" fill="'+col+'" stroke="#fff8ea" stroke-width="3" paint-order="stroke">'+esc(nm)+'</text><text class="tg" y="'+(h+22)+'" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a00" stroke="#fff8ea" stroke-width="3" paint-order="stroke"></text></g>';}
function dhCrowd(){let h='';let sd=7;const r=()=>{sd=(sd*1103515245+12345)>>>0;return (sd>>>8)/16777216;};const C=['#2b2420','#3a2d22','#1d1d1d','#4a3a2a','#6b5a4a','#8a8a8a','#2b2420','#1d1d1d'],B=['#3a4a6a','#6a3a3a','#4a5a3a','#5a4a6a','#7a6a4a','#2d4d7a','#b5361f','#ddd','#c9a24a','#e9e2d0','#4a6a6a'];
 const G=13;for(let y=-210;y<=210;y+=G)for(let x=-210;x<=210;x+=G){const jx=x+(r()-.5)*3,jy=y+(r()-.5)*3;if(Math.abs(jx)<170&&Math.abs(jy)<170)continue;if(Math.abs(jx)>212||Math.abs(jy)>212)continue;
  h+='<g class="fan" transform="translate('+jx.toFixed(1)+','+jy.toFixed(1)+')"><g style="animation-delay:-'+(r()*.6).toFixed(2)+'s"><circle r="7" fill="'+B[Math.floor(r()*B.length)]+'" cy="2.5"/><circle r="4.8" fill="'+C[Math.floor(r()*C.length)]+'" cy="-1.5"/></g></g>';}
 return '<g class="crowd">'+h+'</g>';}
function dhGyoji(){return '<g class="gyo"><g class="grot"><rect x="-13" y="-15" width="24" height="30" rx="8" fill="#6b3b8a" stroke="#2b1a3a" stroke-width="1.5"/><path d="M-9,-10 L3,0 L-9,10" fill="none" stroke="#e8c870" stroke-width="2"/><circle cx="4" r="7" fill="#1d1d1d"/><g class="gb" transform="translate(16,-14)"><line x1="0" y1="8" x2="-8" y2="2" stroke="#5a3a1a" stroke-width="3"/><ellipse rx="9" ry="7" fill="#1d1d1d" stroke="#c9a24a" stroke-width="2.5"/></g></g><text class="gyt" y="-24" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3b8a" stroke="#fff8ea" stroke-width="3" paint-order="stroke"></text></g>';}
function dhSVG(id,nE,nW,kE,kW){return '<div class="dhw" id="'+id+'w"><svg class="dhy" id="'+id+'" viewBox="-215 -215 430 430"><defs><pattern id="'+id+'d" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".9" fill="#7a5a32" opacity=".28"/></pattern><pattern id="'+id+'m" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#9a7a56"/><rect width="25" height="25" fill="none" stroke="#6a4a2a" stroke-width="1"/></pattern><radialGradient id="'+id+'g"><stop offset="0" stop-color="#e3cfa3"/><stop offset="1" stop-color="#d2b98a"/></radialGradient></defs><rect x="-215" y="-215" width="430" height="430" fill="url(#'+id+'m)" rx="10"/>'+dhCrowd()+'<rect x="-163" y="-163" width="326" height="326" fill="#cdb37f" stroke="#a88a5a" stroke-width="2"/><circle r="150" fill="#cdb37f"/><circle r="135" fill="url(#'+id+'g)"/><rect x="-163" y="-163" width="326" height="326" fill="url(#'+id+'d)"/><circle class="tw" r="135" fill="none" stroke="#8a6a3a" stroke-width="9"/>'+
 '<line x1="-14" y1="-14" x2="-14" y2="14" stroke="#fff" stroke-width="3"/><line x1="14" y1="-14" x2="14" y2="14" stroke="#fff" stroke-width="3"/>'+
 '<text y="205" text-anchor="middle" font-size="12" fill="#fff8ea" stroke="#3a2a1a" stroke-width="3" paint-order="stroke">正面</text><text y="-197" text-anchor="middle" font-size="12" fill="#fff8ea" stroke="#3a2a1a" stroke-width="3" paint-order="stroke">向正面</text><text x="-210" y="4" font-size="12" fill="#fff8ea" stroke="#3a2a1a" stroke-width="3" paint-order="stroke">東</text><text x="186" y="4" font-size="12" fill="#fff8ea" stroke="#3a2a1a" stroke-width="3" paint-order="stroke">西</text>'+
 dhGyoji()+'<circle class="fl" r="10" fill="#fff" opacity="0"/><g class="dust"><g class="dd"><circle r="16" fill="#f3e8cf"/><circle cx="22" cy="10" r="12" fill="#f3e8cf"/><circle cx="-20" cy="12" r="13" fill="#f3e8cf"/><circle cx="8" cy="-22" r="11" fill="#f3e8cf"/><circle cx="-14" cy="-18" r="10" fill="#f3e8cf"/><circle cx="26" cy="-10" r="8" fill="#f3e8cf"/></g></g>'+dhRik('ge','#b5361f',nE,kE)+dhRik('gw','#2d4d7a',nW,kW)+
 '<g class="mk" opacity="0"><circle r="40" fill="none" stroke="#b5361f" stroke-width="3" stroke-dasharray="6 4"/><text class="mkt" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5361f" stroke="#fff8ea" stroke-width="3" paint-order="stroke"></text></g>'+

 '<text class="zan" y="-92" text-anchor="middle" font-size="26" font-weight="bold" fill="#b5361f" stroke="#fff8ea" stroke-width="4" paint-order="stroke" opacity="0">残った!</text></svg>'+
 '<div class="dhbar"><span class="be">'+esc(nE)+'</span><i><b></b></i><span class="bw">'+esc(nW)+'</span></div>'+
 '<div class="dhlg"><span><i style="background:#ffb36b"></i>調子が上がった</span><span><i style="background:#ffe14a"></i>突っ張りが炸裂</span><span><i style="background:#e0a82e;border-radius:50%"></i>まわしをしっかりつかんだ</span></div></div>';}
function mix(a,b,u){const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return 'rgb('+pa.map((x,i)=>Math.round(x+(pb[i]-x)*u)).join(',')+')';}
/* fx:{heat 0〜1, burst 0〜1(突っ張りの当たり), grip 0|1} */
function dhPose(g,p,q,stance,ph,pushing,fallen,fx){const S=135;const h=+g.dataset.h;const x=p[0]*S,y=p[1]*S;let a=Math.atan2(q[1]-p[1],q[0]-p[0])*180/Math.PI;g.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')');
 const rot=g.querySelector('.rot');const rr0=Math.hypot(p[0],p[1]);const drop=fx.air>.15?0:Math.max(0,Math.min(1,(rr0-1.02)/.14));const sc=1+(fx.air||0)*.15;g.style.filter=drop>0?'drop-shadow(0 '+(4*drop).toFixed(1)+'px 3px rgba(0,0,0,.3))':'';const dsp=drop*90*(fx.sd||1);const fy=fx.flip===undefined?1:(Math.abs(fx.flip)<.12?(fx.flip<0?-.12:.12):fx.flip);rot.setAttribute('transform','rotate('+(a+(fx.spin||0)+dsp).toFixed(1)+')'+' scale('+sc.toFixed(2)+','+(fy*sc).toFixed(2)+')');g.querySelector('.bd').setAttribute('fill',fy<0?'#d9a87a':mix('#f0c998','#ffa060',fx.heat||0));
 let h1,h2;const dist=Math.hypot(q[0]-p[0],q[1]-p[1])*S;let ext=[0,0];
 if(stance==='tachi'){h1=[h+7,-h*.55];h2=[h+7,h*.55];}
 else if(stance==='oshi'){const r1=Math.max(0,Math.sin(ph*14)),r2=Math.max(0,Math.sin(ph*14+Math.PI));ext=[r1,r2];const L=Math.max(h+6,dist-h*.9);h1=[h+6+r1*(L-h-6),-h*.45];h2=[h+6+r2*(L-h-6),h*.45];}
 else if(stance==='yotsu'){const L=Math.min(dist*.8,h*2.2);h1=[L,-h-6];h2=[L,h+6];}
 else if(stance==='hataki'&&fx.slapper){const L=Math.max(h+8,dist*.85);h1=[L,-h*.25];h2=[L,h*.25];ext=[1,1];}
 else{h1=[h,-h-10];h2=[h,h+10];}
 const a1=g.querySelector('.a1'),a2=g.querySelector('.a2');a1.setAttribute('x1',h*.3);a1.setAttribute('y1',-h*.75);a1.setAttribute('x2',h1[0]);a1.setAttribute('y2',h1[1]);a2.setAttribute('x1',h*.3);a2.setAttribute('y1',h*.75);a2.setAttribute('x2',h2[0]);a2.setAttribute('y2',h2[1]);
 const c1=g.querySelector('.h1'),c2=g.querySelector('.h2');c1.setAttribute('cx',h1[0]);c1.setAttribute('cy',h1[1]);c2.setAttribute('cx',h2[0]);c2.setAttribute('cy',h2[1]);
 /* 色の変化 */

 const gc=fx.grip&&stance==='yotsu';
 [[c1,hit1],[c2,hit2]].forEach(([c,hit],i)=>{c.setAttribute('fill',hit?'#ffe14a':gc?'#e0a82e':'#f0c998');c.setAttribute('stroke',hit?'#ff7a00':gc?'#8a5a00':'#5a3a1a');c.setAttribute('stroke-width',hit||gc?3:1.5);});
 const bs=g.querySelector('.bst');if(hit1||hit2){const hp=hit1?h1:h2;bs.innerHTML='<path d="M0,-11 L3,-3 L11,-3 L5,2 L8,10 L0,5 L-8,10 L-5,2 L-11,-3 L-3,-3Z" fill="#ffe14a" stroke="#ff7a00" stroke-width="1.5" transform="translate('+(hp[0]+9)+','+hp[1]+')"/>';bs.setAttribute('opacity',1);}else bs.setAttribute('opacity',0);
 const tg=g.querySelector('.tg');tg.textContent=fx.tag||'';}
function dhPlay(id,pl,phEl,dur){const sv=document.getElementById(id);if(!sv)return;const wr=document.getElementById(id+'w');dur=dur||5200;const S=135;
 const q=c=>sv.querySelector(c);const ge=q('.ge'),gw=q('.gw'),mk=q('.mk'),st=q('.stamp'),zan=q('.zan'),tw=q('.tw'),fl=q('.fl'),bar=wr.querySelector('.dhbar b');
 [mk,st,zan,fl].forEach(e=>e.setAttribute('opacity',0));tw.setAttribute('stroke','#8a6a3a');wr.classList.remove('shake','boom');
 const rnd=dhRand(pl.P.length*97+Math.round(pl.dir[0]*1000));
 /* まわしをつかむ時:勝つ側は早め、負ける側は半分くらい */
 const gW=.16+rnd()*.15,gL=rnd()<.5?.2+rnd()*.25:9;const gripE=pl.winE?gW:gL,gripW=pl.winE?gL:gW;
 const fxE={heat:0,burst:1,grip:0,tag:''},fxW={heat:0,burst:1,grip:0,tag:''};sv._landed=0;const gy=q('.gyo');let gp=[0,.62];wr.classList.remove('cheer','roar');let tagT={E:0,W:0};
 let pt=0,last=null,lastPh=-1,hit=0;if(sv._raf)cancelAnimationFrame(sv._raf);

  const p0=dhAt(pl,pt);const rmax=Math.max(Math.hypot(p0.E[0],p0.E[1]),Math.hypot(p0.W[0],p0.W[1]));
  let sp=1;if(rmax>.72)sp=.5;if(rmax>.8&&pt<pl.fin)sp=.32;if(pt>pl.fin-.05&&pt<pl.fin+.01)sp=.25;else if((pl.T==='nage'||pl.T==='hiki')&&pt>=pl.fin+.01)sp=.55;else if(pt>=pl.fin&&pt<pl.fin+.06)sp=.25;if(pt<.1)sp=.8;
  const ppt=pt;pt=Math.min(1,pt+dt/dur*sp);const p=dhAt(pl,pt);

  const cx=(p.E[0]+p.W[0])/2,cy=(p.E[1]+p.W[1])/2;const pc=dhAt(pl,ppt);const mv=((cx-(pc.E[0]+pc.W[0])/2)*pl.dir[0]+(cy-(pc.E[1]+pc.W[1])/2)*pl.dir[1])*(pl.winE?1:-1);/* 東が前へ出た量 */
  fxE.heat=Math.max(0,Math.min(1,fxE.heat+mv*6-dt/9000));fxW.heat=Math.max(0,Math.min(1,fxW.heat-mv*6-dt/9000));

  if(pt>=gripW&&!fxW.grip&&p.stance==='yotsu'){fxW.grip=1;fxW.tag='上手をつかんだ!';tagT.W=ts;}
  if(p.stance==='oshi'){if(!fxE.tag&&p.push>0){fxE.tag='突っ張り炸裂!';tagT.E=ts;}if(!fxW.tag&&p.push<0){fxW.tag='突っ張り炸裂!';tagT.W=ts;}}
  if(ts-tagT.E>1500)fxE.tag='';if(ts-tagT.W>1500)fxW.tag='';
  if(fxE.heat>.7&&!fxE.hot){fxE.hot=1;fxE.tag='勢いに乗った!';tagT.E=ts;}if(fxW.heat>.7&&!fxW.hot){fxW.hot=1;fxW.tag='勢いに乗った!';tagT.W=ts;}
  fxE.burst=p.push>=0;fxW.burst=p.push<=0;
  const lf=p.lose==='E'?fxE:fxW,wf=p.lose==='E'?fxW:fxE;lf.sd=pl.sd||1;wf.slapper=p.stance==='hataki';wf.slap=!!p.slap;if(p.slap&&!wf.slapT){wf.slapT=1;wf.tag='はたいた!';(p.lose==='E'?tagT.W=ts:tagT.E=ts);}
  if(p.uchi&&!fxE.uc){fxE.uc=fxW.uc=1;fxE.tag=fxW.tag='投げの打ち合い!';tagT.E=tagT.W=ts;wr.classList.remove('shake');void wr.offsetWidth;wr.classList.add('shake');setTimeout(()=>wr.classList.remove('shake'),300);}
  /* 土俵際の粘り:俵に近いほうが小きざみにふんばる */
  const nE=Math.hypot(p.E[0],p.E[1]),nW=Math.hypot(p.W[0],p.W[1]);if(Math.max(nE,nW)>.78&&pt<pl.fin){const near=nE>nW?'E':'W';const v=near==='E'?p.E:p.W;const j=.018*Math.sin(ts/38);const rr=Math.max(nE,nW);v[0]+=v[0]/rr*j;v[1]+=v[1]/rr*j;const nf=near==='E'?fxE:fxW;if(!nf.neb||ts-nf.neb>2500){nf.neb=ts;nf.tag='俵で粘る!';near==='E'?tagT.E=ts:tagT.W=ts;}}if(p.spin!==undefined){lf.spin=p.spin;lf.flip=p.flip;lf.air=p.air;if(p.air>.1)lf.tag='';}
  if(p.land&&!sv._landed){sv._landed=1;wr.classList.remove('shake');void wr.offsetWidth;wr.classList.add('shake');const lo=p.lose==='E'?p.E:p.W;const du=q('.dust');du.setAttribute('transform','translate('+(lo[0]*S)+','+(lo[1]*S)+')');du.classList.remove('go');void du.getBoundingClientRect();du.classList.add('go');setTimeout(()=>wr.classList.remove('shake'),300);}
  dhPose(ge,p.E,p.W,p.stance,pt*dur/1000,p.push>0,p.lose==='E'?p.fall:0,fxE);dhPose(gw,p.W,p.E,p.stance,pt*dur/1000+.5,p.push<0,p.lose==='W'?p.fall:0,fxW);
  {const ax=p.W[0]-p.E[0],ay=p.W[1]-p.E[1];const al=Math.hypot(ax,ay)||1;let nx=-ay/al,ny=ax/al;if(ny<0){nx=-nx;ny=-ny;}let tx=cx+nx*.5,ty=cy+ny*.5;const tr2=Math.hypot(tx,ty);if(tr2>.88){tx*=.88/tr2;ty*=.88/tr2;}gp=[gp[0]+(tx-gp[0])*.06,gp[1]+(ty-gp[1])*.06];const ga=Math.atan2(cy-gp[1],cx-gp[0])*180/Math.PI;gy.setAttribute('transform','translate('+(gp[0]*S).toFixed(1)+','+(gp[1]*S).toFixed(1)+')');gy.querySelector('.grot').setAttribute('transform','rotate('+ga.toFixed(1)+')');

  const adv=(cx*pl.dir[0]+cy*pl.dir[1])*(pl.winE?1:-1);bar.style.width=(50+Math.max(-48,Math.min(48,adv*55)))+'%';

  if(pt<1)sv._raf=requestAnimationFrame(step);
  else{const lo=p.lose==='E'?p.E:p.W;mk.setAttribute('transform','translate('+(lo[0]*S)+','+(lo[1]*S)+')');q('.mkt').textContent='ここで'+pl.how;mk.setAttribute('opacity',1);
   {const wv=p.lose==='E'?p.W:p.E;const gb=gy.querySelector('.gb');const ga=Math.atan2(wv[1]-gp[1],wv[0]-gp[0])*180/Math.PI;gy.querySelector('.grot').setAttribute('transform','rotate('+ga.toFixed(1)+')');gb.setAttribute('transform','translate(26,0)');gy.querySelector('.gyt').textContent='勝負あり!';wr.classList.remove('cheer');wr.classList.add('roar');setTimeout(()=>wr.classList.remove('roar'),2500);}
   q('.stt').textContent=pl.k;st.setAttribute('transform','translate(0,-70) rotate(-6)');st.setAttribute('opacity',1);wr.classList.add('boom');zan.setAttribute('opacity',0);tw.setAttribute('stroke','#8a6a3a');
   if(phEl){phEl.innerHTML+='<li class="now crowd">館内がどよめく</li>';}}};
 sv._raf=requestAnimationFrame(step);}
const DH_CSS='.dhw{position:relative}.dhy{width:100%;height:auto;display:block}.dhw.shake .dhy{animation:dhs .26s}@keyframes dhs{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}.dhw.boom .stamp{animation:dhb .5s}.dhw.cheer .crowd .fan>g{animation:fan .35s ease-in-out infinite alternate}.dhw.roar .crowd .fan>g{animation:fan .22s ease-in-out infinite alternate}.dhw.roar .crowd .fan:nth-child(3n)>g{animation-duration:.18s}@keyframes fan{0%{transform:translateY(0)}100%{transform:translateY(-3px) scale(1.12)}}.dust .dd{opacity:0;transform-box:fill-box;transform-origin:center}.dust.go .dd{animation:dust 1.1s ease-out}@keyframes dust{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}@keyframes dhb{0%{opacity:0}40%{opacity:1}100%{opacity:1}}'+
 '.dhbar{display:flex;align-items:center;gap:6px;font:12px sans-serif;margin-top:6px}.dhbar i{flex:1;height:10px;background:#2d4d7a;border-radius:5px;overflow:hidden;display:block}.dhbar b{display:block;height:100%;width:50%;background:#b5361f;transition:width .15s}.dhbar .be{color:#b5361f;font-weight:bold}.dhbar .bw{color:#2d4d7a;font-weight:bold}'+
 '.dhlg{display:flex;flex-wrap:wrap;gap:12px;font:12px sans-serif;color:#5a4a33;margin-top:6px}.dhlg i{display:inline-block;width:12px;height:12px;border:1px solid #8a5a00;margin-right:4px;vertical-align:-2px}';

function play(i){cur=i;sd=(sd*31+i*7+3)%9973;const k=KM[i][0],winE=!!KM[i][1];
 document.getElementById('kms').innerHTML=KM.map((x,j)=>'<button class="'+(j===i?'on':'')+'" onclick="play('+j+')">'+x[0]+'</button>').join('')+'<button onclick="play('+i+')">もう一度(展開が変わる)</button>';
 const W=winE?'朝嵐':'若錦',L=winE?'若錦':'朝嵐';document.getElementById('res').innerHTML='<span class="w">勝ち</span><b>'+W+'</b> が <b>'+k+'</b> で '+L+' に(赤=東 朝嵐、青=西 若錦)';
