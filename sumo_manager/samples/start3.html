<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sumo Manager スタート画面 見本 3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;color:#fff;overflow:hidden;background:#111}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.credit{position:fixed;right:8px;bottom:6px;font:11px/1.3 sans-serif;color:rgba(255,255,255,.75);text-shadow:0 1px 2px #000;z-index:9}
.tag{position:fixed;left:8px;top:8px;font:12px sans-serif;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:3px;z-index:9}

.wrap{position:fixed;inset:0;display:flex}
.pic{flex:1.2;background:url(../img/nishikie_dohyoiri.jpg) 52% 50%/cover;position:relative}
.pic:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 70%,#16130f 100%)}
.side{flex:1;background:#16130f;display:flex;flex-direction:column;justify-content:center;padding:4vh 4vw;gap:18px}
.side h1{font-size:clamp(30px,4vw,50px);letter-spacing:.04em}
.side .sub{color:#d9b25a;letter-spacing:.5em;font-size:16px;margin-top:-6px}
.side p.lead{font:14px/1.8 sans-serif;color:#cfc7b8}
.cards{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.cards button{background:#221d17;border:1px solid #5d4b2c;border-left:6px solid #b3261e;color:#fff;text-align:left;padding:16px 18px;border-radius:4px}
.cards button:last-child{border-left-color:#2f5d9e}
.cards b{display:block;font-size:20px;margin-bottom:6px} .cards small{font:13px/1.6 sans-serif;color:#cfc7b8}
@media(max-aspect-ratio:1/1){.wrap{flex-direction:column}.pic{flex:.8}.pic:after{background:linear-gradient(180deg,rgba(0,0,0,0) 60%,#16130f 100%)}.side{flex:1.2;justify-content:flex-start}}

</style></head><body><div class="tag">見本 3:左右分割</div>
<div class="wrap"><div class="pic"></div><div class="side"><h1>Sumo Manager</h1><div class="sub">親方一代</div><p class="lead">親方として部屋を率い、弟子を育てて横綱を目指す。稽古・番付・後援会・年寄名跡まで、本物の角界のしくみで。</p><div class="cards"><button data-go="real"><b>実在の部屋を選ぶ</b><small>2026 年九州場所の番付から。45 部屋・592 人の中から部屋を選び、その師匠になります。</small></button><button data-go="new"><b>新しく部屋を作る</b><small>自分で部屋を開きます。部屋の名前・親方・一門を決め、弟子 7 人から始めます。</small></button></div></div></div><div class="credit">背景:一恵斎芳幾「勧進大相撲土俵入之図」ほか(江戸〜明治の錦絵)</div>
<script>document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>alert(b.dataset.go==='real'?'実在の部屋を選ぶ画面へ進みます(見本)':'新しい部屋を作る画面へ進みます(見本)'));</script></body></html>
