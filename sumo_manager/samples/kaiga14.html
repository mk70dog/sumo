<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>見本 kaiga14:上から見た土俵(大きく・両手・演出)</title><style>
body{margin:0;background:#f3ead7;color:#1d1a16;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 4px}.note{font:13px/1.6 "Hiragino Sans",sans-serif;color:#6b5f4f;margin:0 0 12px}
.hd{display:flex;justify-content:space-between;align-items:baseline;font:13px "Hiragino Sans",sans-serif;color:#6b5f4f;margin-bottom:8px}.hd b{font:bold 16px serif;color:#b5361f}
.box{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:16px;align-items:start}@media(max-width:640px){.box{grid-template-columns:1fr}}
ol.ph{font:15px/1.8 "Hiragino Sans",sans-serif;margin:0;padding-left:20px;max-height:420px;overflow:auto}ol.ph li{color:#8a7a60}ol.ph li.now{color:#1d1a16;font-weight:bold}ol.ph li.crowd{color:#b5361f}
.kms{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.kms button{font:14px "Hiragino Sans",sans-serif;border:1px solid #8a6a3a;background:#fff8ea;border-radius:8px;padding:6px 12px;cursor:pointer}.kms button.on{background:#b5361f;color:#fff;border-color:#b5361f}
.res{font:15px "Hiragino Sans",sans-serif;margin-top:8px}.res .w{background:#b5361f;color:#fff;border-radius:4px;padding:1px 6px;font-size:12px;margin-right:4px}
</style></head><body><div class="wrap"><h1>見本 kaiga14:上から見た土俵(力士を大きく・両手・手に汗握る演出)</h1>
<p class="note">力士を大きくし、両手(差し手・突っ張り)が見えるようにしました。立ち合いの衝撃(画面がゆれる)、攻め合いのシーソー、土俵際では俵が赤くなって「残った!」が点滅し、動きがゆっくりになります。決まった瞬間に決まり手の札がドンと出ます。下の棒はどちらが押しているかです。約 7 秒。</p>
<div class="hd"><span>2026年 九州場所 十四日目・結びの一番</span><b>優勝がかかる一番</b></div>
<div class="box"><div id="sv"></div><ol class="ph" id="ph"></ol></div>
<div class="kms" id="kms"></div><div class="res" id="res"></div></div>
<style id="dhcss"></style>
<script>function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* --- 上から見た土俵 v2(力士を大きく・両手・手に汗握る演出)  kaiga14 --- */
/* 座標:土俵の中心 (0,0)、俵の内側が半径 1。東 = 左(-x)、西 = 右(+x)、正面 = 下(+y)。 */
function dhType(k){k=k||'';if(/うっちゃり|打っ棄り/.test(k))return 'uchari';if(/投げ|捻り|ひねり|掬い|すくい|網打ち|櫓|小股/.test(k))return 'nage';if(/送り/.test(k))return 'okuri';if(/はたき|叩き|引き落とし|引っ掛け|肩透かし|突き落とし|とったり/.test(k))return 'hiki';if(/突き出し|突き倒し|押し出し|押し倒し/.test(k))return 'oshi';if(/倒れ|浴びせ/.test(k))return 'taoshi';return 'yori';}
function dhRand(seed){let s=seed>>>0||1;return ()=>{s=(s*1103515245+12345)>>>0;return (s>>>8)/16777216;};}
/* P の各点:[t, cx, cy, d(2人の間の半分), 構え('tachi'|'yotsu'|'oshi'), 誰が押しているか(1=勝つ側,-1=負ける側,0)] */
function dhPlan(k,winE,seed,nE,nW){const rnd=dhRand(seed),T=dhType(k);const sg=winE?1:-1;const ang=(rnd()-.5)*1.3;const dir=[Math.cos(ang)*sg,Math.sin(ang)];
 const WN=winE?nE:nW,LN=winE?nW:nE;const P=[],ph=[];const st=T==='oshi'||(T==='hiki'&&rnd()<.6)?'oshi':'yotsu';
 const DD=st==='oshi'?.25:.2;const at=(f,a)=>[dir[0]*f-dir[1]*a,dir[1]*f+dir[0]*a];/* f=勝つ側が押す向き、a=横 */
 P.push([0,0,0,.36,'tachi',0]);ph.push([0,'仕切り。両者、手をついた']);
 P.push([.1,0,0,DD,st,0]);ph.push([.1,st==='oshi'?'立ち合い!激しい突っ張りの応酬':'立ち合い!がっぷり四つ']);
 let c=at((rnd()-.5)*.3,(rnd()-.5)*.3);P.push([.2,c[0],c[1],DD,st,0]);
 /* 攻め合い:負ける側が先に攻める場面(シーソー)を入れることがある */
 const sea=rnd()<.6||T==='uchari';let t=.2;
 if(sea){c=at(-.74,(rnd()-.5)*.6);t=.36;P.push([t,c[0],c[1],DD,st,-1]);ph.push([.27,LN+'が攻める!']);ph.push([.34,WN+'、土俵際!残った、残った!']);
  if(T!=='uchari'){c=at(-.05,(rnd()-.5)*.4);t=.5;P.push([t,c[0],c[1],DD,st,1]);ph.push([.42,WN+'、こらえて押し返す']);}}
 const zan=rnd()<.5&&T!=='uchari';
 if(zan){c=at(.76,(rnd()-.5)*.6);t+=.14;P.push([t,c[0],c[1],DD,st,1]);ph.push([t-.06,WN+'が出る!']);ph.push([t-.01,LN+'、俵に足がかかる…残った!']);c=at(.1,(rnd()-.5)*.5);t+=.12;P.push([t,c[0],c[1],DD,st,-1]);ph.push([t-.06,LN+'、回り込んで中央へ']);}
 if(!sea&&!zan){c=at(.15,(rnd()-.5)*.5);t=.45;P.push([t,c[0],c[1],DD,st,0]);ph.push([.3,'土俵中央で動かない…']);}
 /* 決着 */
 let out,how='出た';const L=P[P.length-1];const t0=L[0];const fin=Math.max(t0+.12,.82);
 if(T==='uchari'){const e=at(-.9,(rnd()-.5)*.4);P.push([fin,e[0],e[1],DD,st,-1]);ph.push([t0+.04,LN+'が一気に寄る!']);ph.push([fin-.03,WN+'、俵の上で体を入れ替えた!']);out=at(-1.2,(rnd()<.5?1:-1)*.45);ph.push([.97,k+'!'+WN+'の大逆転']);}
 else if(T==='nage'){P.push([fin,L[1],L[2],DD,st,1]);ph.push([t0+.04,WN+'、上手を引いた']);ph.push([fin-.03,'振った!']);const piv=[L[1],L[2]];const ra=Math.atan2(-dir[1],-dir[0])+(rnd()<.5?1:-1)*2.2;out=[piv[0]+Math.cos(ra)*.4,piv[1]+Math.sin(ra)*.4];how='倒れた';ph.push([.97,k+'!'+WN+'の勝ち']);}
 else if(T==='hiki'){P.push([fin,L[1],L[2],.12,st,-1]);ph.push([t0+.04,LN+'が前に出る']);ph.push([fin-.03,WN+'、引いた!']);out=[L[1]-dir[0]*.5+dir[1]*.15,L[2]-dir[1]*.5-dir[0]*.15];how='落ちた';ph.push([.97,k+'!'+WN+'の勝ち']);}
 else{const e=at(.93,(rnd()-.5)*.5);P.push([fin,e[0],e[1],T==='oshi'?.17:.11,T==='okuri'?'yotsu':st,1]);ph.push([t0+.04,T==='okuri'?WN+'が後ろに回った!':T==='oshi'?WN+'が一気に突き放す!':WN+'が寄って出る!']);ph.push([fin-.04,LN+'、俵に足が…']);out=at(1.22,(rnd()-.5)*.3);if(T==='taoshi')how='倒れた';ph.push([.97,k+'!'+WN+'の勝ち']);}
 return {P,out,how,T,winE,dir,ph,k,WN,LN,fin};}
function dhAt(pl,t){const P=pl.P;let i=0;while(i<P.length-1&&P[i+1][0]<=t)i++;const a=P[i],b=P[Math.min(i+1,P.length-1)];const u=b[0]>a[0]?Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0]))):1;const e=u*u*(3-2*u);
 const cx=a[1]+(b[1]-a[1])*e,cy=a[2]+(b[2]-a[2])*e,d=a[3]+(b[3]-a[3])*e;const dx=pl.dir[0],dy=pl.dir[1];
 let W=[cx-dx*d,cy-dy*d],Lo=[cx+dx*d,cy+dy*d];let stance=(e<.5?a:b)[4],push=(e<.5?a:b)[5],fall=0;
 const lastT=P[P.length-1][0];
 if(t>lastT){const u2=Math.min(1,(t-lastT)/(1-lastT));const e2=1-Math.pow(1-u2,3);fall=e2;Lo=[Lo[0]+(pl.out[0]-Lo[0])*e2,Lo[1]+(pl.out[1]-Lo[1])*e2];
  if(pl.T==='hiki')W=[W[0]+dy*.15*e2,W[1]-dx*.15*e2];else if(pl.T!=='nage')W=[W[0]+(pl.out[0]-W[0])*.3*e2,W[1]+(pl.out[1]-W[1])*.3*e2];stance=pl.T==='oshi'?'oshi':'free';}
 return pl.winE?{E:W,W:Lo,stance,push:push*(1),fall,lose:'W'}:{E:Lo,W:W,stance,push:-push,fall,lose:'E'};}
/* 力士(真上から):体・まわし・頭(まげ)・両腕と両手 */
function dhRik(cls,col,nm){return '<g class="'+cls+'"><g class="rot"><g class="arms"><line class="a1" stroke="#c99a6a" stroke-width="9" stroke-linecap="round"/><line class="a2" stroke="#c99a6a" stroke-width="9" stroke-linecap="round"/><circle class="h1" r="6.5" fill="#f0c998" stroke="#5a3a1a" stroke-width="1.5"/><circle class="h2" r="6.5" fill="#f0c998" stroke="#5a3a1a" stroke-width="1.5"/></g>'+
 '<ellipse rx="25" ry="29" fill="#f0c998" stroke="'+col+'" stroke-width="5"/><ellipse cx="12" rx="11" ry="10" fill="#2b2420"/><ellipse cx="7" rx="6" ry="3" fill="#000"/></g>'+
 '<text class="nm" y="-40" text-anchor="middle" font-size="13" font-weight="bold" fill="'+col+'" stroke="#fff8ea" stroke-width="3" paint-order="stroke">'+esc(nm)+'</text></g>';}
function dhSVG(id,nE,nW){return '<div class="dhw" id="'+id+'w"><svg class="dhy" id="'+id+'" viewBox="-170 -170 340 340"><defs><radialGradient id="'+id+'g"><stop offset="0" stop-color="#e3cfa3"/><stop offset="1" stop-color="#d2b98a"/></radialGradient></defs><rect x="-170" y="-170" width="340" height="340" fill="#e8dcc0" rx="10"/><circle r="150" fill="#cdb37f"/><circle r="135" fill="url(#'+id+'g)"/><circle class="tw" r="135" fill="none" stroke="#8a6a3a" stroke-width="9"/>'+
 '<line x1="-14" y1="-14" x2="-14" y2="14" stroke="#fff" stroke-width="3"/><line x1="14" y1="-14" x2="14" y2="14" stroke="#fff" stroke-width="3"/>'+
 '<text y="166" text-anchor="middle" font-size="12" fill="#5a4a33">正面</text><text y="-158" text-anchor="middle" font-size="12" fill="#5a4a33">向正面</text><text x="-166" y="4" font-size="12" fill="#5a4a33">東</text><text x="152" y="4" font-size="12" fill="#5a4a33">西</text>'+
 '<polyline class="pe" fill="none" stroke="#b5361f" stroke-width="2.5" stroke-dasharray="4 4" opacity=".55"/><polyline class="pw" fill="none" stroke="#2d4d7a" stroke-width="2.5" stroke-dasharray="4 4" opacity=".55"/>'+
 '<circle class="fl" r="10" fill="#fff" opacity="0"/>'+dhRik('ge','#b5361f',nE)+dhRik('gw','#2d4d7a',nW)+
 '<g class="mk" opacity="0"><circle r="34" fill="none" stroke="#b5361f" stroke-width="3" stroke-dasharray="6 4"/><text class="mkt" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5361f" stroke="#fff8ea" stroke-width="3" paint-order="stroke"></text></g>'+
 '<g class="stamp" opacity="0"><rect x="-70" y="-22" width="140" height="44" rx="6" fill="#fff8ea" stroke="#b5361f" stroke-width="4"/><text class="stt" y="9" text-anchor="middle" font-size="24" font-weight="bold" fill="#b5361f" font-family="serif"></text></g>'+
 '<text class="zan" y="-92" text-anchor="middle" font-size="26" font-weight="bold" fill="#b5361f" stroke="#fff8ea" stroke-width="4" paint-order="stroke" opacity="0">残った!</text></svg>'+
 '<div class="dhbar"><span class="be">'+esc(nE)+'</span><i><b></b></i><span class="bw">'+esc(nW)+'</span></div></div>';}
function dhPose(g,p,q,stance,ph,pushing,fallen){/* p=自分、q=相手 */const S=135;const x=p[0]*S,y=p[1]*S;let a=Math.atan2(q[1]-p[1],q[0]-p[0])*180/Math.PI;g.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')');
 const rot=g.querySelector('.rot');rot.setAttribute('transform','rotate('+a.toFixed(1)+')'+(fallen?' scale('+(1-.25*fallen)+')':''));
 let h1,h2;const dist=Math.hypot(q[0]-p[0],q[1]-p[1])*S;
 if(stance==='tachi'){h1=[20,-15];h2=[20,15];}
 else if(stance==='oshi'){const r1=Math.max(0,Math.sin(ph*14)),r2=Math.max(0,Math.sin(ph*14+Math.PI));const L=Math.min(dist-18,48);h1=[22+r1*(L-22),-13];h2=[22+r2*(L-22),13];}
 else if(stance==='yotsu'){const L=Math.min(dist*.85,52);h1=[L,-31];h2=[L,31];}
 else{h1=[18,-26];h2=[18,26];}
 if(pushing){h1[0]+=3;h2[0]+=3;}
 const s1=[6,-20],s2=[6,20];const set=(c,v)=>{const e=g.querySelector(c);return e;};
 const a1=g.querySelector('.a1'),a2=g.querySelector('.a2');a1.setAttribute('x1',s1[0]);a1.setAttribute('y1',s1[1]);a1.setAttribute('x2',h1[0]);a1.setAttribute('y2',h1[1]);a2.setAttribute('x1',s2[0]);a2.setAttribute('y1',s2[1]);a2.setAttribute('x2',h2[0]);a2.setAttribute('y2',h2[1]);
 const c1=g.querySelector('.h1'),c2=g.querySelector('.h2');c1.setAttribute('cx',h1[0]);c1.setAttribute('cy',h1[1]);c2.setAttribute('cx',h2[0]);c2.setAttribute('cy',h2[1]);}
function dhPlay(id,pl,phEl,dur){const sv=document.getElementById(id);if(!sv)return;const wr=document.getElementById(id+'w');dur=dur||7000;const S=135;
 const q=c=>sv.querySelector(c);const pe=q('.pe'),pw=q('.pw'),ge=q('.ge'),gw=q('.gw'),mk=q('.mk'),st=q('.stamp'),zan=q('.zan'),tw=q('.tw'),fl=q('.fl'),bar=wr.querySelector('.dhbar b');
 const tr={E:[],W:[]};[mk,st,zan,fl].forEach(e=>e.setAttribute('opacity',0));tw.setAttribute('stroke','#8a6a3a');wr.classList.remove('shake','boom');
 let pt=0,last=null,lastPh=-1,hit=0;if(sv._raf)cancelAnimationFrame(sv._raf);
 const step=ts=>{const dt=last===null?0:Math.min(50,ts-last);last=ts;
  const p0=dhAt(pl,pt);const rmax=Math.max(Math.hypot(p0.E[0],p0.E[1]),Math.hypot(p0.W[0],p0.W[1]));
  let sp=1;if(rmax>.72)sp=.5;if(pt>pl.fin-.05&&pt<pl.fin+.06)sp=.25;if(pt<.1)sp=.8;
  pt=Math.min(1,pt+dt/dur*sp);const p=dhAt(pl,pt);
  dhPose(ge,p.E,p.W,p.stance,pt*dur/1000,p.push>0,p.lose==='E'?p.fall:0);dhPose(gw,p.W,p.E,p.stance,pt*dur/1000+.5,p.push<0,p.lose==='W'?p.fall:0);
  tr.E.push((p.E[0]*S).toFixed(1)+','+(p.E[1]*S).toFixed(1));tr.W.push((p.W[0]*S).toFixed(1)+','+(p.W[1]*S).toFixed(1));pe.setAttribute('points',tr.E.join(' '));pw.setAttribute('points',tr.W.join(' '));
  /* 攻勢の棒:真ん中から勝つ側の押す向きへどれだけ出たか */
  const cx=(p.E[0]+p.W[0])/2,cy=(p.E[1]+p.W[1])/2;const adv=(cx*pl.dir[0]+cy*pl.dir[1])*(pl.winE?1:-1);bar.style.width=(50+Math.max(-48,Math.min(48,adv*55)))+'%';
  /* 立ち合いの衝撃 */
  if(!hit&&pt>=.1){hit=1;wr.classList.add('shake');fl.setAttribute('cx',cx*S);fl.setAttribute('cy',cy*S);fl.setAttribute('opacity',.9);setTimeout(()=>{fl.setAttribute('opacity',0);wr.classList.remove('shake');},260);}
  /* 土俵際:俵が赤く、残った! */
  const edge=rmax>.8&&pt<pl.fin+.02;tw.setAttribute('stroke',edge?'#d23a1f':'#8a6a3a');zan.setAttribute('opacity',edge?(.6+.4*Math.sin(ts/90)):0);
  if(phEl){let k=-1;pl.ph.forEach((x,i)=>{if(pt>=x[0])k=i;});if(k!==lastPh){lastPh=k;phEl.innerHTML=pl.ph.slice(0,k+1).map((x,i)=>'<li'+(i===k?' class="now"':'')+'>'+esc(x[1])+'</li>').join('');phEl.scrollTop=1e5;}}
  if(pt<1)sv._raf=requestAnimationFrame(step);
  else{const lo=p.lose==='E'?p.E:p.W;mk.setAttribute('transform','translate('+(lo[0]*S)+','+(lo[1]*S)+')');const mt=q('.mkt');mt.textContent='ここで'+pl.how;mk.setAttribute('opacity',1);
   q('.stt').textContent=pl.k;st.setAttribute('transform','translate(0,-60) rotate(-6)');st.setAttribute('opacity',1);wr.classList.add('boom');zan.setAttribute('opacity',0);tw.setAttribute('stroke','#8a6a3a');
   if(phEl){phEl.innerHTML+='<li class="now crowd">館内がどよめく</li>';}}};
 sv._raf=requestAnimationFrame(step);}
const DH_CSS='.dhw{position:relative}.dhy{width:100%;height:auto;display:block}.dhw.shake .dhy{animation:dhs .26s}@keyframes dhs{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}.dhw.boom .stamp{animation:dhb .5s}@keyframes dhb{0%{opacity:0}40%{opacity:1}100%{opacity:1}}'+
 '.dhbar{display:flex;align-items:center;gap:6px;font:12px sans-serif;margin-top:6px}.dhbar i{flex:1;height:10px;background:#2d4d7a;border-radius:5px;overflow:hidden;display:block}.dhbar b{display:block;height:100%;width:50%;background:#b5361f;transition:width .15s}.dhbar .be{color:#b5361f;font-weight:bold}.dhbar .bw{color:#2d4d7a;font-weight:bold}';

document.getElementById('dhcss').textContent=DH_CSS;
const KM=[['寄り切り',1],['押し出し',1],['上手投げ',1],['はたき込み',1],['寄り倒し',0],['送り出し',1],['うっちゃり',0]];let cur=0,sd=11;
document.getElementById('sv').innerHTML=dhSVG('dh','朝嵐','若錦');
function play(i){cur=i;sd=(sd*31+i*7+3)%9973;const k=KM[i][0],winE=!!KM[i][1];
 document.getElementById('kms').innerHTML=KM.map((x,j)=>'<button class="'+(j===i?'on':'')+'" onclick="play('+j+')">'+x[0]+'</button>').join('')+'<button onclick="play('+i+')">もう一度(展開が変わる)</button>';
 const W=winE?'朝嵐':'若錦',L=winE?'若錦':'朝嵐';document.getElementById('res').innerHTML='<span class="w">勝ち</span><b>'+W+'</b> が <b>'+k+'</b> で '+L+' に(赤=東 朝嵐、青=西 若錦)';
 dhPlay('dh',dhPlan(k,winE,sd,'朝嵐','若錦'),document.getElementById('ph'),5200);}
setTimeout(()=>play(0),300);</script></body></html>
