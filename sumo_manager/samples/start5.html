<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sumo Manager スタート画面 見本 5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;color:#fff;overflow:hidden;background:#111}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.credit{position:fixed;right:8px;bottom:6px;font:11px/1.3 sans-serif;color:rgba(255,255,255,.75);text-shadow:0 1px 2px #000;z-index:9}
.tag{position:fixed;left:8px;top:8px;font:12px sans-serif;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:3px;z-index:9}

.bg{position:fixed;top:0;bottom:0;left:0;width:200vw;max-width:none;background:url(../img/nishikie_dohyoiri.jpg) left center/auto 100%;animation:pan 40s ease-in-out infinite alternate}
@keyframes pan{from{transform:translateX(0)}to{transform:translateX(calc(-100% + 100vw))}}
@media(prefers-reduced-motion:reduce){.bg{animation:none;width:100vw;background-size:cover;background-position:center}}
.top{position:fixed;top:0;left:0;right:0;padding:18px 0 34px;text-align:center;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0));z-index:2}
.top h1{font-size:clamp(30px,5vw,56px);letter-spacing:.08em;text-shadow:0 3px 8px #000}
.top p{letter-spacing:.5em;font-size:15px}
.obi{position:fixed;left:0;right:0;bottom:0;background:#4b2a6b;border-top:4px solid #c9a24a;padding:16px 4vw 22px;display:flex;justify-content:center;z-index:2}
.obi .z{display:flex;gap:16px;width:min(860px,100%)}
.obi button{flex:1;background:#f4ede0;color:#2b1d12;border:none;border-radius:6px;padding:14px 16px;text-align:left;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.obi button:first-child{border-left:8px solid #b3261e}.obi button:last-child{border-left:8px solid #2f5d9e}
.obi b{display:block;font-size:19px;margin-bottom:4px}.obi small{font:12px/1.6 sans-serif;color:#4a3a28}
.credit{bottom:2px;color:rgba(255,255,255,.7)}.obi{padding-bottom:26px}
@media(max-width:640px){.obi .z{flex-direction:column}.top{padding-top:36px}}
.top p{display:inline-block;background:rgba(0,0,0,.55);padding:2px 8px 2px 14px;border-radius:3px}

</style></head><body><div class="tag">見本 5:動く錦絵</div>
<div class="bg"></div><div class="top"><h1>Sumo Manager</h1><p>親方一代</p></div><div class="obi"><div class="z"><button data-go="real"><b>実在の部屋を選ぶ</b><small>2026 年九州場所の番付から。45 部屋・592 人の中から部屋を選び、その師匠になります。</small></button><button data-go="new"><b>新しく部屋を作る</b><small>自分で部屋を開きます。部屋の名前・親方・一門を決め、弟子 7 人から始めます。</small></button></div></div><div class="credit">背景:一恵斎芳幾「勧進大相撲土俵入之図」ほか(江戸〜明治の錦絵)</div>
<script>document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>alert(b.dataset.go==='real'?'実在の部屋を選ぶ画面へ進みます(見本)':'新しい部屋を作る画面へ進みます(見本)'));</script></body></html>
