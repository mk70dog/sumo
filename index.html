<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Judge Console Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet"></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 30% 0%, #0d0d1a 0%, #0e1018 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 1px, transparent 3px),
    #0e1018;
  color:#ccddee;font-family:'DotGothic16',monospace,'Courier New',Courier;
  min-height:100dvh;overflow-x:hidden;
  padding:14px 12px 40px;
}
button,a.btn{font-family:'DotGothic16',monospace,'Courier New',Courier;cursor:pointer;touch-action:manipulation}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ===== HEADER ===== */
#hdr{
  background:linear-gradient(160deg,#111118 0%,#0d0d14 45%,#080810 100%);
  border:1px solid #2a2e3a;border-radius:8px;
  padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.5);
  margin-bottom:8px;
}
.logo{font-size:14px;font-weight:bold;letter-spacing:0.13em;color:#ccddee;text-shadow:0 1px 0 #000,0 0 10px rgba(154,138,94,0.18)}
.subtitle{font-size:9px;color:#8899aa;letter-spacing:0.1em;margin-top:2px}
#langtoggle{display:flex;gap:2px;flex-shrink:0}
.langbtn{
  background:linear-gradient(160deg,#1a1c22 0%,#0e1018 100%);
  border:1px solid #2a2e3a;border-top:1px solid #3a3e4a;border-bottom:1px solid #080a10;
  color:#8899aa;padding:5px 10px;font-size:10px;letter-spacing:0.05em;border-radius:4px;
  box-shadow:0 2px 5px rgba(0,0,0,0.5),inset 0 1px 0 rgba(220,220,210,0.05);
}
.langbtn.on{
  background:linear-gradient(160deg,#061228 0%,#0a1a3a 100%);border:1px solid #0055aa;
  color:#4499ee;text-shadow:0 0 6px rgba(170,200,220,0.5);
  box-shadow:0 0 10px rgba(74,85,96,0.5),inset 0 1px 0 rgba(170,184,196,0.15);
}

/* ===== STATUS BAR ===== */
#mbar{
  background:#0d0d14;border:1px solid #1a1a2e;border-radius:6px;
  padding:6px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px;
}
.mdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite}
.mdot.grn{background:#7a8a5a;box-shadow:0 0 5px #7a8a5a}
.mdot.blu{background:#0055aa;box-shadow:0 0 5px #0055aa;animation-delay:0.7s}
.mdot.gld{background:#4499ee;box-shadow:0 0 5px #4499ee;animation-delay:1.4s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.mgrp{display:flex;align-items:center;gap:5px}
.mlbl{font-size:9px;color:#556677;letter-spacing:0.08em}

/* ===== CARD ===== */
.card{position:relative;overflow:hidden;background:linear-gradient(160deg,#111118 0%,#0d0d14 45%,#080810 100%);
  border:1px solid #2a2e3a;border-radius:8px;padding:16px 16px;margin-bottom:14px;
  box-shadow:0 5px 14px rgba(0,0,0,0.55),inset 0 1px 0 rgba(220,220,210,0.06),inset 0 -2px 6px rgba(0,0,0,0.4);
  background-image:
    radial-gradient(circle at 7px 7px, #8899aa 0%, #0e1018 55%, transparent 60%),
    radial-gradient(circle at calc(100% - 7px) 7px, #8899aa 0%, #0e1018 55%, transparent 60%),
    radial-gradient(circle at 7px calc(100% - 7px), #8899aa 0%, #0e1018 55%, transparent 60%),
    radial-gradient(circle at calc(100% - 7px) calc(100% - 7px), #8899aa 0%, #0e1018 55%, transparent 60%),
    linear-gradient(160deg,#111118 0%,#0d0d14 45%,#080810 100%);
  background-size:7px 7px,7px 7px,7px 7px,7px 7px,100% 100%;
  background-repeat:no-repeat;}
.card::before{content:'';position:absolute;inset:0;border-radius:8px;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(220,220,210,0.18) 0.5px,transparent 0.5px);
  background-size:3px 3px;
  mask:linear-gradient(160deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.18) 55%,transparent 100%);
  -webkit-mask:linear-gradient(160deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.18) 55%,transparent 100%)}
.card>*{position:relative;z-index:1}

/* ===== APP MODULE ===== */
.appbadge{display:inline-flex;align-items:center;gap:6px;font-size:9px;color:#445566;letter-spacing:0.12em;
  border:1px solid #1a1a2e;border-radius:3px;padding:2px 7px;margin-bottom:10px}
.appbadge .dot{width:5px;height:5px;border-radius:50%;background:#4499ee;box-shadow:0 0 4px #4499ee;flex-shrink:0}
.apptitle{font-size:17px;letter-spacing:0.08em;color:#ccddee;text-shadow:0 0 12px rgba(68,153,238,0.3);margin-bottom:4px}
.apptag{font-size:9.5px;color:#4499ee;letter-spacing:0.1em;text-shadow:0 0 6px rgba(170,200,220,0.5);margin-bottom:12px}
.appdesc{font-size:10.5px;line-height:1.85;color:#aabbcc;margin-bottom:16px}

/* ===== GLOW BUTTON ===== */
.gbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#061228 0%,#1a2838 50%,#12202e 100%);
  border:none;border-radius:5px;color:#4499ee;padding:0 20px;height:42px;font-size:11.5px;
  letter-spacing:0.08em;text-decoration:none;
  box-shadow:0 4px 0 #080e14,0 5px 2px rgba(0,0,0,0.55),inset 0 1px 0 rgba(100,140,180,0.2),
    inset 0 -2px 0 rgba(0,0,0,0.25),0 0 14px rgba(60,90,120,0.4);
  text-shadow:0 0 6px rgba(170,200,220,0.5);
  transition:transform 0.06s,box-shadow 0.06s;
}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #080e14,0 2px 1px rgba(0,0,0,0.45)}
.gbtn .arrow{transition:transform .15s}
.gbtn:hover .arrow{transform:translateX(3px)}
.gbtn2{
  background:linear-gradient(180deg,#1e2030 0%,#141622 50%,#0e1018 100%);
  color:#8899aa;
  box-shadow:0 4px 0 #0e0e0c,0 5px 2px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 -2px 0 rgba(0,0,0,0.22);
  text-shadow:0 1px 2px rgba(0,0,0,0.9);
}
.gbtn2:active{box-shadow:0 1px 0 #0e0e0c,0 2px 1px rgba(0,0,0,0.45)}

/* ===== FEATURE GRID ===== */
.gridhead{font-size:9px;color:#556677;letter-spacing:0.14em;text-transform:uppercase;margin:4px 0 8px;
  display:flex;align-items:center;gap:6px}
.gridhead::before{content:'';width:3px;height:10px;background:linear-gradient(#4499ee,#061228);flex-shrink:0}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media (min-width:640px){.fgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.fgrid{grid-template-columns:repeat(5,1fr)}}
.fcard{background:#0d0d14;border:1px solid #1a1a2e;border-left:2px solid #4499ee;border-radius:3px;
  padding:8px 9px}
.fnum{font-size:7.5px;color:#445566;letter-spacing:0.1em}
.ftitle{font-size:10px;color:#ccddee;letter-spacing:0.03em;margin:3px 0 4px;line-height:1.4}
.fdesc{font-size:8px;color:#7f92a6;line-height:1.55}

/* ===== FOOTER ===== */
#ftr{
  background:#05070a;border:1px solid #2a2e3a;border-radius:6px;
  color:#4f575e;padding:14px 16px;margin-top:18px;font-size:9px;letter-spacing:0.03em;line-height:1.8;
}
#ftr .fttitle{color:#8899aa;font-size:9px;letter-spacing:0.1em;margin-bottom:6px}

[data-lang]{display:none}
[data-lang].active{display:block}
span[data-lang].active{display:inline}
</style>
</head>
<body>

<div id="hdr">
  <div>
    <div class="logo">JUDGE CONSOLE HUB</div>
    <div class="subtitle" data-i18n="hdr.sub"></div>
  </div>
  <div id="langtoggle">
    <button class="langbtn" data-setlang="en">EN</button>
    <button class="langbtn" data-setlang="ja">日本語</button>
  </div>
</div>

<div id="mbar">
  <div class="mgrp"><div class="mdot grn"></div><span class="mlbl" data-i18n="bar.ready"></span></div>
  <div class="mgrp"><div class="mdot blu"></div><span class="mlbl" data-i18n="bar.systems"></span></div>
  <div class="mgrp"><div class="mdot gld"></div><span class="mlbl" data-i18n="bar.fanmade"></span></div>
</div>

<!-- APP 1: ASL SK JUDGE -->
<div class="card">
  <div class="appbadge"><span class="dot"></span><span>UNIT-01 &middot; ASL-SK1</span></div>
  <div class="apptitle">ASL SK JUDGE</div>
  <div class="apptag" data-i18n="asl.tag"></div>
  <div class="appdesc" data-i18n="asl.desc"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <a class="gbtn" href="ASLSK_1_v1.html">
      <span data-i18n="cta.enter"></span><span class="arrow">&#9654;</span>
    </a>
    <a class="gbtn gbtn2" href="guide.html">
      <span data-i18n="cta.howto"></span><span class="arrow">&#9654;</span>
    </a>
  </div>
  <div class="gridhead" data-i18n="asl.gridhead"></div>
  <div class="fgrid" id="fgrid-asl"></div>
</div>

<!-- APP 2: GUNSLINGER JUDGE -->
<div class="card">
  <div class="appbadge"><span class="dot"></span><span>UNIT-02 &middot; GUNSLINGER</span></div>
  <div class="apptitle">GUNSLINGER JUDGE Mk.II</div>
  <div class="apptag" data-i18n="gun.tag"></div>
  <div class="appdesc" data-i18n="gun.desc"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <a class="gbtn" href="GunJudge40.html">
      <span data-i18n="cta.enter"></span><span class="arrow">&#9654;</span>
    </a>
  </div>
  <div class="gridhead" data-i18n="gun.gridhead"></div>
  <div class="fgrid" id="fgrid-gun"></div>
</div>

<div id="ftr">
  <div class="fttitle" data-i18n="ftr.title"></div>
  <div data-i18n="ftr.body"></div>
</div>

<script>
var I18N = {
  ja:{
    "hdr.sub":"TABLETOP WARGAME ADJUDICATION SYSTEMS",
    "bar.ready":"READY",
    "bar.systems":"2 SYSTEMS ONLINE",
    "bar.fanmade":"非公式・ファン制作",
    "asl.tag":"ADVANCED SQUAD LEADER STARTER KIT #1 専用 判定支援コンソール",
    "asl.desc":"IFT・CCTなどの判定をアプリが自動計算し、ルール参照とユニット管理を手助けする非公式ツールです。ASLSK #1（歩兵戦闘）のプレイに特化しています。",
    "asl.gridhead":"主な機能",
    "gun.tag":"西部劇ガンファイト・ボードゲーム「GUNSLINGER」専用 判定支援コンソール",
    "gun.desc":"射撃・組討・投擲・シナリオ進行などの判定を自動化し、キャラクターと武器のステータス管理を手助けする非公式ツールです。",
    "gun.gridhead":"主な機能",
    "cta.enter":"コンソールを起動",
    "cta.howto":"使い方",
    "ftr.title":"ご利用にあたって",
    "ftr.body":"本サイトで紹介する各ツールは、個人・非営利のファン制作による非公式リファレンス／計算補助アプリです。「Advanced Squad Leader」「ASL」「ASL Starter Kit」および「Gunslinger」は、それぞれの権利者の商標・著作物です。本サイトの各ツールはそれらの権利者とは一切関係がなく、承認・提携も受けていません。"
  },
  en:{
    "hdr.sub":"TABLETOP WARGAME ADJUDICATION SYSTEMS",
    "bar.ready":"READY",
    "bar.systems":"2 SYSTEMS ONLINE",
    "bar.fanmade":"UNOFFICIAL &middot; FAN-MADE",
    "asl.tag":"A JUDGE CONSOLE FOR ADVANCED SQUAD LEADER STARTER KIT #1",
    "asl.desc":"An unofficial companion tool that auto-resolves IFT and CCT results, tracks unit status, and keeps rules at your fingertips \u2014 built specifically for ASLSK #1 (infantry combat).",
    "asl.gridhead":"KEY FEATURES",
    "gun.tag":"A JUDGE CONSOLE FOR THE GUNSLINGER TABLETOP GAME",
    "gun.desc":"An unofficial companion tool that resolves shooting, melee, and throwing checks, walks through scenario setup, and tracks character and weapon status.",
    "gun.gridhead":"KEY FEATURES",
    "cta.enter":"ENTER CONSOLE",
    "cta.howto":"HOW TO USE",
    "ftr.title":"BEFORE YOU PLAY",
    "ftr.body":"Each tool on this site is an unofficial, non-commercial, fan-made reference and calculation aid. \u201cAdvanced Squad Leader,\u201d \u201cASL,\u201d \u201cASL Starter Kit,\u201d and \u201cGunslinger\u201d are trademarks/works of their respective rights holders. None of the tools on this site are affiliated with or endorsed by those rights holders."
  }
};

var FEATURES = {
  asl:{
    ja:[
      ["01","回復/修理/回収","士気回復・機関銃の修理・放棄火器の回収"],
      ["02","射撃/残留火力","通常射撃・IFT判定・残留火力の計算"],
      ["03","移動/運搬","移動コスト・道路ボーナス・運搬PP"],
      ["04","爆薬配置/起動","DC（爆薬）の配置と起爆"],
      ["05","潰走/阻止","潰走移動と阻止射撃"],
      ["06","突撃/白兵戦","突撃移動とCCT計算"],
      ["07","士気/損耗","MC・ELR超過・損耗チェーン"],
      ["08","早見表","IFT・CCTなどの早見表"],
      ["09","シナリオ","収録シナリオ情報"],
      ["10","ユニット","分隊・HS・指揮官・携行火器の管理"]
    ],
    en:[
      ["01","Rally / Repair / Recovery","Rally, MG repair, weapon recovery"],
      ["02","Fire / Residual FP","Normal fire, IFT, residual firepower"],
      ["03","Movement / Portage","Movement costs, road bonus, portage points"],
      ["04","DC Placement","Demolition charge placement & detonation"],
      ["05","Rout / Interdiction","Rout movement and interdiction fire"],
      ["06","Assault / Close Combat","Assault movement and the CCT"],
      ["07","Morale / Casualties","MC results, ELR, casualty chains"],
      ["08","Quick Reference","IFT, CCT, and other tables"],
      ["09","Scenarios","Included scenario information"],
      ["10","Units","Squads, half-squads, leaders, hand weapons"]
    ]
  },
  gun:{
    ja:[
      ["01","SHOOT","射撃判定の解決"],
      ["02","MELEE","組討・接近戦の解決"],
      ["03","THROW","投擲武器の判定"],
      ["04","SCENARIO","シナリオ進行の管理"],
      ["05","CHARACTERS","キャラクターのステータス管理"],
      ["06","ARMORY","武器データの参照"],
      ["07","QUICK REF","早見表の参照"]
    ],
    en:[
      ["01","SHOOT","Resolve shooting checks"],
      ["02","MELEE","Resolve melee / close-quarters combat"],
      ["03","THROW","Resolve thrown-weapon checks"],
      ["04","SCENARIO","Manage scenario setup and flow"],
      ["05","CHARACTERS","Track character status"],
      ["06","ARMORY","Look up weapon data"],
      ["07","QUICK REF","Browse quick-reference tables"]
    ]
  }
};

function fillGrid(id, lang, key){
  var grid = document.getElementById(id);
  grid.innerHTML = '';
  FEATURES[key][lang].forEach(function(f){
    var d = document.createElement('div');
    d.className = 'fcard';
    d.innerHTML = '<div class="fnum">'+f[0]+'</div><div class="ftitle">'+f[1]+'</div><div class="fdesc">'+f[2]+'</div>';
    grid.appendChild(d);
  });
}

function render(lang){
  document.documentElement.lang = lang;
  var dict = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined) el.textContent = dict[key];
  });
  document.querySelectorAll('.langbtn').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-setlang') === lang);
  });
  fillGrid('fgrid-asl', lang, 'asl');
  fillGrid('fgrid-gun', lang, 'gun');
}

var currentLang = 'en';
render(currentLang);

document.querySelectorAll('.langbtn').forEach(function(b){
  b.addEventListener('click', function(){
    currentLang = b.getAttribute('data-setlang');
    render(currentLang);
  });
});
</script>
</body>
</html>
